name: Codex cloud pipeline
run-name: "Codex cloud ${{ inputs.mode || 'live' }}"
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [probe, canary, live]
        default: probe
      run_seconds:
        description: Detection window before draining active work (60–10800 seconds)
        default: '10800'
  schedule:
    - cron: '17,47 * * * *'

# Single owner of credentials, durable state and task execution. No concurrent
# runners may refresh the same subscription login or spend the same budget.
concurrency:
  group: codex-cloud-pipeline
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  runtime:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode != 'live') || vars.CODEX_CLOUD_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CODEX_HOME: /home/runner/codex-cloud-auth
      OSS_CLOUD_STATE_DIR: /home/runner/codex-cloud-state
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ripgrep bubblewrap apparmor-profiles apparmor-utils libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libcairo2 libpango-1.0-0 libasound2t64
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / -- /usr/bin/true
          corepack enable
          npm install --global @openai/codex@0.159.3
          bash install-validation-tools.sh
          python -m pip install PyYAML==6.0.3 cryptography==48.0.1 'aiohttp>=3.11.8,<4' 'pytest-aiohttp>=1,<2' 'pytest-asyncio>=1,<2' 'websocket-client>=1,<2'
          ./verify.sh
      - name: Install dedicated subscription login
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: python cloud_runtime.py install-auth
      - name: Configure GitHub controller
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MODE: ${{ inputs.mode || 'live' }}
        run: |
          git config --global user.name oss-pipeline
          git config --global user.email chelsealong@126.com
          gh auth setup-git
          if [ "$MODE" = live ] || [ "$MODE" = canary ]; then
            git clone --single-branch --branch codex-state --depth=1 https://github.com/chelsealong/oss-pipeline.git "$OSS_CLOUD_STATE_DIR"
          fi
      - name: Run managed Codex services
        id: runtime
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OSS_READONLY_GH_TOKEN: ${{ github.token }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OSS_ARTIFACT_KEY: ${{ secrets.OSS_ARTIFACT_KEY }}
          MODE: ${{ inputs.mode || 'live' }}
          RUN_SECONDS: ${{ inputs.run_seconds || '10800' }}
        run: python -u cloud_runtime.py "$MODE" --seconds "$RUN_SECONDS"
      - name: Preserve encrypted recovery evidence
        if: always()
        env:
          OSS_ARTIFACT_KEY: ${{ secrets.OSS_ARTIFACT_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import runtime as rt
          import cloud_state
          import work_evidence as evidence
          dest=Path('.runtime/encrypted-artifacts');dest.mkdir(parents=True,exist_ok=True)
          with rt.db() as db:
              ids=[r[0] for r in db.execute('SELECT id FROM tasks')]
          for task_id in ids:
              if rt.task_state(task_id).get('folder'):
                  rt.task_state(task_id,terminal=True)
                  evidence.capture(task_id)
          for path in (rt.DATA/'evidence').glob('*.json'):
              if not (rt.DATA/'jobs'/path.stem.split('-')[0]).exists():continue
              evidence.atomic(dest/(path.name+'.enc'),evidence.encrypt(path.read_bytes()))
          for path in rt.DATA.glob('*.log'):
              evidence.atomic(dest/(path.name+'.enc'),evidence.encrypt(path.read_bytes()))
          # Retain reservations and publication markers even when final state
          # pushing fails. This checkpoint is encrypted, never a plaintext upload.
          checkpoint=rt.DATA/'recovery-checkpoint.json'
          cloud_state.export_state(checkpoint)
          evidence.atomic(dest/'runtime-checkpoint.json.enc',evidence.encrypt(checkpoint.read_bytes()))
          checkpoint.unlink()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-recovery-${{ github.run_id }}
          path: .runtime/encrypted-artifacts/*.enc
          include-hidden-files: true
          retention-days: 14
      - name: Continue cloud chain
        if: always() && steps.runtime.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          enabled=$(gh api repos/chelsealong/oss-pipeline/actions/variables/CODEX_CLOUD_ENABLED --jq .value)
          if [ "$enabled" = true ]; then
            gh workflow run codex-cloud.yml --repo chelsealong/oss-pipeline --ref main -f mode=live
          fi
      - name: Remove subscription cache
        if: always()
        run: |
          python - <<'PY'
          import os,shutil
          shutil.rmtree(os.environ['CODEX_HOME'],ignore_errors=True)
          PY
