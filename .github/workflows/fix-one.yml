name: Fix one issue

# Triggered by the local watcher the moment it vets a new upstream issue.
#
# Why the fix runs here and not on the Mac: Anthropic returns HTTP 403 to the
# consumer-VPN datacenter range the Mac exits from (AS60068 Datacamp), so
# `claude -p` dies there with "Failed to authenticate. API Error: 403". GitHub
# runners exit from AS8075 Microsoft and get 401 (reachable) — verified by
# probe-claude.yml, where `claude -p` returned OK.
#
# Detection stays local (fast, needs only the GitHub API, which the VPN reaches
# fine); only the Claude-dependent step is offloaded. We are dispatched directly
# rather than waiting on `schedule`, whose delivery was observed at twice in six
# hours for a */5 cron.
on:
  workflow_dispatch:
    inputs:
      repo_key:
        description: 'Repo key as defined in scan.py REPOS (e.g. adk, openclaw)'
        required: true
      issue:
        description: 'Issue number, already vetted by the watcher'
        required: true
      dry_run:
        description: 'Resolve and print the plan; do not run Claude or open a PR'
        type: boolean
        default: false

# The group is per-issue, NOT a single shared lock. A shared group looks like a
# queue but is not one: GitHub keeps at most ONE pending run per group and
# cancels any earlier pending run when a newer one arrives. Dispatching three
# candidates in a burst therefore produced one run and two silent
# `completed/cancelled` — the watcher's own logs still said "dispatched", so the
# loss was invisible. Per-issue groups only collapse genuine duplicates of the
# same issue, which is what we actually wanted.
#
# Serialisation is still enforced, but by the wait-for-turn step below, which
# holds a run until no older fix-one run is active. That queues instead of
# discarding.
concurrency:
  group: oss-fix-one-${{ inputs.repo_key }}-${{ inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Wait for turn
        # One fix in flight at a time. Bounded: after the cap we proceed anyway
        # rather than hang, because a stuck predecessor must not silently stop
        # the pipeline — the failure mode we keep re-learning is "looks fine,
        # produces nothing".
        env:
          # PIPELINE_TOKEN does not exist and never did. `gh run list` therefore
          # ran unauthenticated, failed, hit `|| echo 0`, and every run concluded
          # that nothing older was active — so this step has never once waited.
          # Six fix-one runs were observed in_progress simultaneously while this
          # was supposedly serialising them.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -uo pipefail
          for i in $(seq 1 30); do
            if ! out=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow fix-one.yml \
                         --status in_progress --limit 20 --json databaseId \
                         --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID)] | length" 2>&1); then
              # Do not read an API failure as "the coast is clear" — that is
              # exactly how the missing token turned this into a no-op.
              echo "::warning::cannot list runs ($(printf '%s' "$out" | head -1)); proceeding without serialisation"
              exit 0
            fi
            older="$out"
            [ "${older:-0}" -eq 0 ] && { echo "clear to run (waited $((i-1)) min)"; exit 0; }
            echo "  $older older run(s) active; waiting (${i}/30)"
            sleep 60
          done
          echo "::warning::waited 30min for a free slot; proceeding anyway"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve repo config
        id: cfg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys
          sys.path.insert(0, '.')
          import scan
          key = os.environ['KEY']
          cfg = scan.REPOS.get(key)
          if not cfg:
              print("ok=false"); print(f"why=unknown repo key {key}"); raise SystemExit(0)
          upstream = cfg['upstream']
          print(f"ok=true")
          print(f"upstream={upstream}")
          print(f"implements_in={cfg.get('implements_in', upstream)}")
          print(f"needs_assignment={cfg.get('needs_assignment', False)}")
          # Repos whose own policy forbids an autonomous PR: push a branch only.
          print(f"prepare_only={key in ('transformers',)}")
          PY
        env:
          KEY: ${{ inputs.repo_key }}

      - name: Daily cap
        id: cap
        if: steps.cfg.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          case "${{ inputs.repo_key }}" in
            adk) cap=7 ;;
            hermes) cap=10 ;;
            spec-kit) cap=5 ;;
            openclaw) cap=4 ;;
            comfyui) cap=3 ;;
            dify) cap=5 ;;
            autogpt) cap=3 ;;
            vllm|sglang|pydantic-ai) cap=3 ;;
            langfuse|langfuse-python) cap=3 ;;
            firecrawl) cap=1 ;;
            *) cap=2 ;;
          esac
          n=$(gh pr list --repo "${{ steps.cfg.outputs.implements_in }}" --author chelsealong \
                --state all --search "created:>=$(date -u +%Y-%m-%d)" --json number --jq 'length' \
                2>/dev/null || echo 0)
          echo "opened today: $n / cap $cap"
          if [ "$n" -ge "$cap" ]; then echo "over=true" >> "$GITHUB_OUTPUT"; else echo "over=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout target fork
        id: fork
        if: steps.cfg.outputs.ok == 'true' && steps.cap.outputs.over != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          impl="${{ steps.cfg.outputs.implements_in }}"
          name="${impl##*/}"
          git clone --depth 50 "https://x-access-token:${GH_TOKEN}@github.com/chelsealong/${name}.git" work
          cd work
          git remote add upstream "https://github.com/${impl}.git"
          git fetch --depth 200 upstream

          # Start from UPSTREAM's tip, never the fork's main, which drifts.
          # Two adk PRs were based 358 commits back — before upstream pinned its
          # third-party actions to commit SHAs (07-16, 07-20) — so the merge ref
          # that pull_request_target builds still contained the unpinned
          # workflows, zizmor's `unpinned-uses` rule fired, and the org-level
          # "GitHub Actions Scan" failed. 10 of 11 recent scans passed; the only
          # failure was ours. Rebasing onto upstream/main cleared it immediately.
          DEF=$(git remote show upstream | awk "/HEAD branch/ {print \$NF}")
          DEF="${DEF:-main}"
          git checkout -q -B work-base "upstream/${DEF}"
          echo "based on upstream/${DEF} @ $(git rev-parse --short HEAD)"
          # Publish it: the review steps must diff against the SAME base. They
          # used to guess `upstream/HEAD`, which `git remote show` queries from
          # the remote but never creates as a local ref, so the guess always
          # failed and they fell back to `upstream/main`. On AutoGPT, whose
          # default branch is `master`, that stale branch turned a two-file
          # change into a 339-file, 27k-line "diff" — the reviewer noticed and
          # worked around it by hand, which is not a thing to rely on.
          echo "default_branch=${DEF}" >> "$GITHUB_OUTPUT"
          # The CLA bot matches the COMMIT EMAIL; chelsealong@126.com is the
          # address registered on it. Using any other address fails the check.
          git config user.name  "chelsealong"
          git config user.email "chelsealong@126.com"

      - name: Re-vet before spending a session
        id: pre
        if: steps.cfg.outputs.ok == 'true' && steps.cap.outputs.over != 'true' && inputs.dry_run != true
        # The watcher vetted this issue when it appeared; dispatch happens later,
        # and by then someone may have claimed it or opened a PR. Of the last 18
        # generator runs, 25% ended in a SKIP whose reason was purely mechanical
        # ("already has a linked PR", "has an active claimant") — each one paid
        # for a full agent session to discover something the GitHub API answers
        # for free. Re-check here, before Claude Code is even installed.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPSTREAM: ${{ steps.cfg.outputs.upstream }}
          NUM: ${{ inputs.issue }}
          REPO_KEY: ${{ inputs.repo_key }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          sys.path.insert(0, '.')
          import scan

          up, num = os.environ['UPSTREAM'], int(os.environ['NUM'])

          def out(k, v):
              print(f"{k}={v}")

          issue = json.loads(scan.gh(["api", f"repos/{up}/issues/{num}",
                                      "--jq", "{state:.state,title:.title,assignees:[.assignees[].login]}"]))
          if issue["state"] != "open":
              out("taken", "true"); out("why", "issue is closed"); raise SystemExit(0)
          # Honour the repo's own ignore_assignees. langfuse assigns a triager to
          # nearly every bug, which is exactly why its config sets the flag — but
          # this check ignored the config and killed all 11 langfuse dispatches at
          # the pre-vet, for zero PRs. Look the config up by REPO_KEY, not by
          # upstream: langfuse and langfuse-python share one upstream and only one
          # of them sets the flag.
          cfg = scan.REPOS.get(os.environ.get("REPO_KEY", ""), {})
          if issue["assignees"] and not cfg.get("ignore_assignees"):
              out("taken", "true"); out("why", f"assigned to {issue['assignees']}"); raise SystemExit(0)
          if prs := scan.linked_prs(up, num):
              out("taken", "true"); out("why", f"linked PR(s) {prs[:3]}"); raise SystemExit(0)
          if who := scan.claimants(up, num):
              out("taken", "true"); out("why", f"claimed by {who[0]}"); raise SystemExit(0)

          # A competing PR often never references the issue number — it just
          # describes the same fix in different words, so linked_prs cannot see
          # it. dify#38956 was abandoned only after the agent had explored the
          # repo and found #39133 doing the same thing.
          #
          # Multi-word queries are AND and match almost nothing ("signin redirect"
          # -> 0 hits, "signin" -> #39133 first). So run one query per distinctive
          # term and union the results; GitHub stems, so "redirects" finds
          # "redirecting". Identifiers like agent_v2 are the strongest terms.
          GENERIC = {"error", "issue", "when", "with", "that", "this", "from", "into",
                     "does", "fail", "fails", "failed", "bug", "should", "cannot",
                     "using", "after", "before", "support", "feature", "request",
                     "problem", "wrong", "broken", "there", "would", "could"}

          def pick_terms(title, k=3):
              ws = [w for w in re.findall(r"[A-Za-z][A-Za-z0-9_]{4,}", title)
                    if w.lower() not in GENERIC]
              # Identifiers first (underscore or mixedCase), then longest.
              ws.sort(key=lambda w: (("_" in w or not w.islower() and not w.istitle()), len(w)),
                      reverse=True)
              seen, out_ = set(), []
              for w in ws:
                  if w.lower() not in seen:
                      seen.add(w.lower()); out_.append(w)
              return out_[:k]

          hits = {}
          for term in pick_terms(issue["title"]):
              try:
                  raw = scan.gh(["search", "prs", "--repo", up, "--state", "open",
                                 "--limit", "4", "--json", "number,title", term])
              except Exception as e:  # noqa: BLE001
                  print(f"::warning::PR search for {term!r} failed: {str(e)[:100]}", file=sys.stderr)
                  continue
              for rank, pr in enumerate(json.loads(raw or "[]")):
                  # Dependency bumps rank on any keyword and are never a competing fix.
                  if re.match(r"(chore|build)\(deps\)|bump \S+ from ", pr["title"], re.I):
                      continue
                  h = hits.setdefault(pr["number"],
                                      {"t": " ".join(pr["title"].split())[:88], "n": 0, "best": 99})
                  h["n"] += 1
                  h["best"] = min(h["best"], rank)

          near = sorted(hits.items(), key=lambda kv: (-kv[1]["n"], kv[1]["best"]))[:4]

          # Advisory, not a hard block: a title match is a hint, and silently
          # dropping a real candidate is worse than one wasted session. The agent
          # is told to read these FIRST instead of rediscovering them late.
          out("taken", "false")
          out("competing", " | ".join(f"#{n} {h['t']}" for n, h in near))
          PY

      - name: Skip — taken since dispatch
        if: steps.pre.outputs.taken == 'true'
        run: |
          echo "::notice::${{ steps.pre.outputs.why }} — no agent session spent"

      - name: Install Claude Code
        if: steps.cfg.outputs.ok == 'true' && steps.cap.outputs.over != 'true' && inputs.dry_run != true && steps.pre.outputs.taken != 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Generator and evaluator are deliberately SEPARATE claude invocations.
      # A single run that both writes the fix and judges it is grading its own
      # homework; a fresh context that never saw the reasoning is a real check.
      # An earlier version of this pipeline had such a pass and it caught a real
      # defect (a wrong-place fix that still passed the original tests) — that
      # gate was lost when this workflow was written, and this restores it.
      - name: Load lessons for this repo
        id: lessons
        run: |
          # Every step is a fresh process and the claude steps run in work/, so
          # /tmp is not a reliable channel between them — a verdict written by
          # the reviewer was invisible to the remediation step, which then
          # correctly refused to invent one. Use one workspace-relative dir that
          # every step can reach.
          mkdir -p "$GITHUB_WORKSPACE/.loop"
          # Durable corrections: what previous runs on THIS repo got wrong.
          # Without this, every run re-derives the same knowledge and repeats the
          # same mistakes — the CLA trailer, the politely-worded claim that
          # keyword matching misses, the Studio issues that are out of scope.
          f="lessons/${{ inputs.repo_key }}.md"
          if [ -s "$f" ]; then
            cp "$f" $GITHUB_WORKSPACE/.loop/lessons.md
            echo "  $(wc -l < "$f") lines of prior lessons"
          else
            echo "(no prior lessons recorded for this repo)" > $GITHUB_WORKSPACE/.loop/lessons.md
          fi
          cat $GITHUB_WORKSPACE/.loop/lessons.md

      - name: Generate fix and push branch (no PR yet)
        id: gen
        if: steps.cfg.outputs.ok == 'true' && steps.cap.outputs.over != 'true' && inputs.dry_run != true && steps.pre.outputs.taken != 'true'
        working-directory: work
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Optional second subscription. Empty when the secret is not set, in
          # which case the fallback below is skipped entirely.
          ALT_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          KEY: ${{ inputs.repo_key }}
          NUM: ${{ inputs.issue }}
          UPSTREAM: ${{ steps.cfg.outputs.upstream }}
          IMPL: ${{ steps.cfg.outputs.implements_in }}
          NEEDS_ASSIGN: ${{ steps.cfg.outputs.needs_assignment }}
          PREPARE_ONLY: ${{ steps.cfg.outputs.prepare_only }}
          COMPETING: ${{ steps.pre.outputs.competing }}
        run: |
          cat > "$RUNNER_TEMP/fmt.py" <<'FMT'
          import json, sys

          # This is an observability aid. It must never be able to fail the step:
          # a WebSearch event carries `message` as a str, and the old
          # `(ev.get("message") or {}).get("content")` raised AttributeError,
          # killed the pipe and took a 6-minute session down with it. Every level
          # is now type-checked, and any event that still surprises us is printed
          # raw instead of raising.
          def blocks(ev):
              msg = ev.get("message") if isinstance(ev, dict) else None
              content = msg.get("content") if isinstance(msg, dict) else None
              return content if isinstance(content, list) else []

          try:
              for line in sys.stdin:
                  try:
                      ev = json.loads(line)
                  except ValueError:
                      # Never swallow an unparsed line: the session-limit notice
                      # is plain text and the quota guard greps this stream.
                      print(line, end="", flush=True)
                      continue
                  try:
                      for blk in blocks(ev):
                          if not isinstance(blk, dict):
                              continue
                          kind = blk.get("type")
                          if kind == "tool_use":
                              a = blk.get("input")
                              a = a if isinstance(a, dict) else {}
                              d = a.get("command") or a.get("file_path") or a.get("pattern") or ""
                              print("  [" + str(blk.get("name")) + "] " + str(d)[:150], flush=True)
                          elif kind == "text":
                              t = blk.get("text")
                              if isinstance(t, str) and t.strip():
                                  print(t[:400], flush=True)
                      if isinstance(ev, dict) and ev.get("type") == "result":
                          print("  [result] " + str(ev.get("subtype")) +
                                " turns=" + str(ev.get("num_turns")), flush=True)
                  except BrokenPipeError:
                      raise
                  except Exception as e:
                      print("  [fmt] skipped an event (" + type(e).__name__ + ")", flush=True)
          except BrokenPipeError:
              pass
          FMT

          # pipefail: the formatter must not mask the agent's exit status.
          set -o pipefail
          run_claude() {
          timeout 2400 claude -p "$(cat <<EOF
          You are an autonomous OSS contribution agent. Handle exactly ONE issue.
          Do the work and PUSH A BRANCH, but do NOT open a pull request — a
          separate reviewer decides that.

          It was already vetted by the watcher (open, unassigned, no linked PR by
          three independent signals, no comment claimants). Do NOT pick a
          different issue and do NOT re-triage the tracker.

            repo key:         ${KEY}
            issue:            #${NUM}
            upstream:         ${UPSTREAM}
            implements_in:    ${IMPL}
            needs_assignment: ${NEEDS_ASSIGN}
            prepare_only:     ${PREPARE_ONLY}

          The working directory is a checkout of chelsealong/${IMPL##*/} with
          'upstream' pointing at ${IMPL}. Git identity is already correct.

          LESSONS FROM PREVIOUS RUNS ON THIS REPO — read $GITHUB_WORKSPACE/.loop/lessons.md first.
          Each line is something an earlier attempt got wrong here. Treat them as
          hard constraints, not suggestions.

          THIS IS A ONE-SHOT NON-INTERACTIVE SESSION. When you end your turn the
          process exits immediately and everything not yet written to disk is
          lost. NEVER run a command in the background and then stop to wait for
          it: there is no later turn in which a notification can reach you. Run
          every build, lint and test in the FOREGROUND and wait for it there,
          with a timeout if it may hang. Two runs (openclaw#117153, autogpt#8937)
          burned 25 and 6 minutes of work and ended with the literal words "I'll
          stop polling now and wait for their completion notifications" — no
          branch, no outcome, nothing recoverable.

          BEFORE ANY OTHER WORK, write a provisional
          'SKIP: run did not reach a conclusion' to
          $GITHUB_WORKSPACE/.loop/outcome.txt, and overwrite it the moment you know better.
          A run that dies mid-way must still say something; "no outcome written"
          tells the next run nothing and costs a full session to rediscover.

          MANDATORY, in order:

          1. Read $GITHUB_WORKSPACE/.loop/lessons.md, then the repo's own contributor docs
             (AGENTS.md / CLAUDE.md / CONTRIBUTING.md), and follow both,
             including risky-area exclusions.

          2. RE-VERIFY THE CLAIM NOW, before writing code. Assignees, linked PRs
             and comment claimants were already re-checked mechanically a moment
             ago and were clear, so do NOT repeat those queries. What machines
             cannot judge is a PR that fixes this without naming the issue.
             These open PRs have similar titles — read them FIRST, before
             exploring the repo:

               ${COMPETING:-(none found)}

             Also weigh politely-worded claims like "I don't want to race you",
             which keyword matching misses. If any signal shows it is taken,
             write 'SKIP: <reason>' to $GITHUB_WORKSPACE/.loop/outcome.txt and stop.

          3. If needs_assignment is True and you do not hold the assignment,
             leave one short comment asking to be assigned, write
             'SKIP: needs assignment' to $GITHUB_WORKSPACE/.loop/outcome.txt, and stop.

          4. Implement the MINIMAL fix. On openclaw a patch adding more than
             120 lines, and on comfyui more than 250, is REFUSED at PR time and
             the whole session is wasted — external PRs that land on openclaw
             run a median of +61 lines, and the only one of ours that merged
             there is +38. If the smallest correct fix cannot fit, say so and
             stop rather than writing a large one.
             Never touch CI/workflow files, release or
             versioning machinery, generated files, or auth/credential code.

             That list includes DEPENDENCY MANIFESTS AND LOCKFILES — package.json,
             pnpm-lock.yaml, uv.lock, poetry.lock, Cargo.lock, requirements.txt,
             go.sum — even to "sync with main" or to refresh a security override.
             A run on openclaw#115138 pushed a dependency-graph change to a
             two-file SQLite fix and had to revert it fifteen minutes later. The
             reviewer reads the file list before the diff: hermes triage told a
             competing PR to strip its unrelated uv.lock and vercel-workers
             changes while picking ours, at +49/-2, as the best fix.

             If the branch genuinely fails to build on a stale dependency, that
             is a merge-base problem. Merge upstream. Do not edit the manifest.

          5. Add or update a test and PROVE IT FAILS WITHOUT THE FIX. The fix will
             already be committed, so 'git stash' does nothing — use
             'git checkout HEAD~1 -- <source file>', run the test, confirm it
             fails, then 'git checkout HEAD -- <source file>'.

          6. Run the repo's real lint and test commands. If something fails for
             unrelated reasons, confirm the same failure on unmodified
             upstream/main. Never push a broken change.

          7. Commit messages must NOT contain any Co-Authored-By trailer, and
             never 'Co-Authored-By: ... <noreply@anthropic.com>'. A CLA bot counts
             it as a second contributor with no CLA and fails the whole check.

             SEPARATELY: if repo key is 'vllm', every commit MUST carry a
             Signed-off-by trailer — commit with `git commit -s`. That repo
             enforces DCO on each commit and a missing sign-off fails the check.
             This is not the same thing as Co-Authored-By and does not conflict
             with the rule above: sign-off asserts the author certifies the
             contribution, and the author is us. Do not add it anywhere else.

          8. Push the branch to origin. Then write these files:
               $GITHUB_WORKSPACE/.loop/branch.txt   the branch name, one line
               $GITHUB_WORKSPACE/.loop/pr-title.md  the PR title, one line
               $GITHUB_WORKSPACE/.loop/pr-body.md   the full PR body, including real test output and
                                 whatever AI-assistance disclosure that repo
                                 requires
               $GITHUB_WORKSPACE/.loop/outcome.txt  'READY' if the branch is pushed and worth a PR,
                                 or 'SKIP: <reason>' if nothing should be opened
             Do NOT run 'gh pr create'. Never force-push. Never merge.

          If the right outcome is to do nothing, write SKIP with the reason and
          explain. That is a normal result, not a failure.
          EOF
          )" < /dev/null --permission-mode acceptEdits \
            --output-format stream-json --verbose \
            --allowedTools "Bash Read Write Edit Glob Grep WebFetch" \
            | python3 -u "$RUNNER_TEMP/fmt.py"
          }

          # `cmd | tee` reports tee's exit status, which is always 0, so the old
          # `if run_claude | tee ...; then break; fi` broke out on the first pass
          # every time and the retry logic never once ran. Read PIPESTATUS.
          #
          # Quota is checked on the OUTPUT, not the status: claude prints
          # "You've hit your session limit · resets 4:10am (UTC)" and exits 0.
          # Sleeping until that reset is free here (public repo, free Actions
          # minutes) and is the only way the candidate is not simply lost — the
          # watcher marks an issue seen at dispatch and never re-offers it.
          # Order matters: exhaust the primary subscription, then the spare, and
          # only sleep for a reset if neither has quota. Sleeping first would
          # idle for an hour with an unused account sitting right there.
          waited_for_reset=0
          switched_token=0
          for attempt in 1 2 3 4 5; do
            start=$(date +%s)
            run_claude 2>&1 | tee /tmp/claude.out; rc=${PIPESTATUS[0]}

            if grep -qi "session limit" /tmp/claude.out 2>/dev/null; then
              if [ -n "${ALT_OAUTH_TOKEN:-}" ] && [ "$switched_token" -eq 0 ]; then
                echo "::notice::primary subscription is out of quota - switching to the second account"
                export CLAUDE_CODE_OAUTH_TOKEN="$ALT_OAUTH_TOKEN"
                switched_token=1
                continue
              fi
              if [ "$waited_for_reset" -eq 1 ]; then
                echo "::notice::every account still rate limited after waiting - candidate abandoned"
                echo "outcome=QUOTA" >> "$GITHUB_OUTPUT"; exit 0
              fi
              secs=$(python3 - <<'PYEOF'
          import datetime, re, sys
          m = re.search(r"resets\s+(\d{1,2}):(\d{2})\s*(am|pm)", open("/tmp/claude.out", errors="ignore").read(), re.I)
          if not m:
              print(0); sys.exit()
          h, mi, ap = int(m.group(1)) % 12, int(m.group(2)), m.group(3).lower()
          if ap == "pm":
              h += 12
          now = datetime.datetime.now(datetime.timezone.utc)
          t = now.replace(hour=h, minute=mi, second=0, microsecond=0)
          if t <= now:
              t += datetime.timedelta(days=1)
          print(int((t - now).total_seconds()) + 120)
          PYEOF
              )
              if [ "${secs:-0}" -le 0 ] || [ "${secs:-0}" -gt 5400 ]; then
                echo "::notice::SESSION LIMIT, reset time unusable (${secs:-?}s) - candidate stays queued"
                echo "outcome=QUOTA" >> "$GITHUB_OUTPUT"; exit 0
              fi
              echo "::notice::SESSION LIMIT - sleeping ${secs}s until reset, then one retry"
              sleep "$secs"
              waited_for_reset=1
              continue
            fi

            [ "$rc" -eq 0 ] && break
            elapsed=$(( $(date +%s) - start ))
            if [ "$elapsed" -gt 60 ]; then
              echo "failed after ${elapsed}s - not retrying (may have done partial work)"
              echo "outcome=ERROR" >> "$GITHUB_OUTPUT"; exit 1
            fi
            [ "$attempt" -eq 3 ] && { echo "outcome=ERROR" >> "$GITHUB_OUTPUT"; exit 1; }
            sleep $((30 * attempt))
          done

          # Quota exhaustion must be checked on the OUTPUT, not the exit code.
          # `claude -p` prints "You've hit your session limit" and exits 0, so the
          # retry loop above breaks normally and the provisional outcome.txt was
          # being read as a genuine SKIP — a quota block recorded as a verdict on
          # the issue, and the candidate dropped instead of retried.
          if grep -qi "session limit" /tmp/claude.out 2>/dev/null; then
            echo "::notice::SESSION LIMIT reached - candidate stays queued, nothing decided"
            echo "outcome=QUOTA" >> "$GITHUB_OUTPUT"; exit 0
          fi

          out=$(head -1 $GITHUB_WORKSPACE/.loop/outcome.txt 2>/dev/null || echo "SKIP: no outcome written")
          echo "generator outcome: $out"
          case "$out" in
            READY*) echo "outcome=READY" >> "$GITHUB_OUTPUT" ;;
            *)      echo "outcome=SKIP" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Adversarial review
        id: review
        if: steps.gen.outputs.outcome == 'READY'
        working-directory: work
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPSTREAM: ${{ steps.cfg.outputs.upstream }}
          NUM: ${{ inputs.issue }}
          DEF: ${{ steps.fork.outputs.default_branch }}
        run: |
          # The agent call pipes into the stream formatter; without pipefail
          # the pipeline reports the formatter's status, which is always 0.
          set -o pipefail
          # Diff against the branch we were actually cut from, resolved once in
          # the checkout step, not guessed here.
          base=$(git merge-base HEAD "upstream/${DEF}" 2>/dev/null || echo "")
          if [ -n "$base" ]; then
            git diff "$base" HEAD > $GITHUB_WORKSPACE/.loop/change.diff
          else
            echo "::warning::no merge base with upstream/${DEF}; falling back to the last commit"
            git diff HEAD~1 HEAD > $GITHUB_WORKSPACE/.loop/change.diff || true
          fi
          echo "diff: $(git diff --name-only "${base:-HEAD~1}" HEAD | wc -l) file(s), $(wc -l < $GITHUB_WORKSPACE/.loop/change.diff) line(s) vs upstream/${DEF}"
          wc -l $GITHUB_WORKSPACE/.loop/change.diff

          timeout 1200 claude -p "$(cat <<EOF
          You are reviewing a pull request that ANOTHER agent prepared for
          ${UPSTREAM}#${NUM}. You did not write it. Your job is to REFUTE it.
          Assume it is wrong until the evidence says otherwise — a bad PR on a
          third-party repo costs far more than a missed one.

          THIS IS A ONE-SHOT NON-INTERACTIVE SESSION. Never start a command in
          the background and then end your turn waiting for it — no later turn
          exists in which a notification can reach you. Run every check in the
          foreground.

          The diff is $GITHUB_WORKSPACE/.loop/change.diff; the proposed PR body is $GITHUB_WORKSPACE/.loop/pr-body.md.
          The full checkout is here, so read the surrounding code, not just the
          diff.

          Attack it on six fronts:
          0. NO-OP — does this change behaviour AT ALL? Setting a value to the
             default it already holds, re-calling an idempotent setter, or
             guarding a condition that cannot occur are all no-ops that look
             like fixes and pass their own tests. hermes#82124 was closed for
             exactly this: setFocusable(true) on a window Electron already
             defaults to focusable, copied from a window that deliberately
             creates itself focusable:false. If the patch copies a pattern from
             elsewhere in the repo, find out WHY that site needs it and confirm
             the same reason applies here. Then check the report is still live:
             read the code it quotes on CURRENT main — if that code was moved or
             replaced, the bug may already be gone. Prove behaviour changed, or
             BLOCK.
          1. CORRECTNESS — does it actually fix the issue? Edge cases, error
             paths, concurrency, off-by-one. Is the fix in the RIGHT PLACE, or
             does it patch a symptom while the cause sits elsewhere?
          2. SCOPE — anything beyond the minimal fix? Does it touch an area the
             repo's own docs exclude (CI/workflows, generated files, release
             machinery, auth/credentials)?
          3. TEST HONESTY — would the new test ACTUALLY fail without the source
             change? Verify it: 'git checkout HEAD~1 -- <source file>', run the
             test, confirm failure, restore. A test that passes either way proves
             nothing and is the single most common way a bad PR looks good.
             Necessary but not sufficient: a test asserting "the helper calls
             setFocusable(true)" fails without the helper and still proves
             nothing about behaviour — that is how hermes#82124 got through.
             The test must assert the OBSERVABLE effect, not that a line ran.
          4. SECURITY — only if the change touches an attack surface: filesystem
             paths built from request data, SQL or shell built by concatenation,
             deserialisation, redirects, template rendering, authn/authz
             decisions, secrets. For a path: is the value sanitised, then
             RESOLVED, then checked to still be under the base directory, in
             that order? A check before resolution is not a check. If the change
             touches none of these, say so in one line and move on — do not
             invent a threat model.

             This front exists because it was missing: AutoGPT#13752 replaced
             GCS uploads with local filesystem writes, the review approved it on
             the other three fronts, and CodeQL then raised six high-severity
             path-expression alerts. The guard turned out to be correct, but
             nothing in the review had looked.

          5. EVIDENCE — is every claim in $GITHUB_WORKSPACE/.loop/pr-body.md backed by real command
             output that you can reproduce here? Invented or copy-pasted output
             is disqualifying.

          Record your verdict in $GITHUB_WORKSPACE/.loop/verdict.txt: FIRST LINE exactly
          'APPROVE' or 'BLOCK', then your reasoning. You do NOT have a Write
          tool — that is deliberate, a reviewer must not be able to edit the code
          it is judging — so use a shell redirect:

            { echo BLOCK; echo; echo "<your reasoning>"; } > $GITHUB_WORKSPACE/.loop/verdict.txt

          Do not end your turn until that file exists and has your verdict in it.
          A previous run reasoned its way to a real, reproducible regression and
          then finished with "just need the write permission granted" — the file
          was never created, the reasoning was lost, and the remediation step
          that depends on it burned a whole session with nothing to act on. BLOCK if any front fails, and be
          specific about what would have to change. Do not modify the code, do
          not push, do not open anything.
          EOF
          )" < /dev/null --permission-mode acceptEdits \
            --output-format stream-json --verbose \
            --allowedTools "Bash Read Glob Grep" \
            | python3 -u "$RUNNER_TEMP/fmt.py" 2>&1 | tail -30 || true

          if [ ! -s "$GITHUB_WORKSPACE/.loop/verdict.txt" ]; then
            echo "::warning::reviewer produced NO verdict file - treating as blocked, but this is a reviewer failure, not a judgement on the change"
            echo "verdict=NOVERDICT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v=$(head -1 $GITHUB_WORKSPACE/.loop/verdict.txt)
          echo "verdict: $v"
          echo "--- reviewer reasoning ---"; sed -n '2,40p' $GITHUB_WORKSPACE/.loop/verdict.txt 2>/dev/null || true
          case "$v" in
            APPROVE*) echo "verdict=APPROVE" >> "$GITHUB_OUTPUT" ;;
            *)        echo "verdict=BLOCK" >> "$GITHUB_OUTPUT" ;;
          esac

      # act -> check -> re-prompt until the gate passes or the budget runs out.
      # One remediation attempt only: if a fresh reviewer still refuses after the
      # author has seen the objections, the change is probably wrong rather than
      # badly explained, and grinding further just burns quota.
      - name: Remediate once if blocked
        id: remediate
        if: steps.review.outputs.verdict == 'BLOCK'
        working-directory: work
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPSTREAM: ${{ steps.cfg.outputs.upstream }}
          NUM: ${{ inputs.issue }}
        run: |
          # The agent call pipes into the stream formatter; without pipefail
          # the pipeline reports the formatter's status, which is always 0.
          set -o pipefail
          timeout 1200 claude -p "$(cat <<EOF
          An independent reviewer BLOCKED your change to ${UPSTREAM}#${NUM}. Their
          objections are in $GITHUB_WORKSPACE/.loop/verdict.txt. Read them and decide honestly:

          (One-shot session: never background a command and end your turn waiting
          for it — the process exits and the work is lost. Foreground everything.)

          * If they are RIGHT — fix exactly what they identified, re-run the
            tests (including proving the test still fails without the source
            change via 'git checkout HEAD~1 -- <file>'), amend or add a commit,
            push to the same branch, refresh $GITHUB_WORKSPACE/.loop/pr-body.md, and write 'FIXED'
            to $GITHUB_WORKSPACE/.loop/remediation.txt.
          * If the change cannot be salvaged, or the objection reveals the fix is
            in the wrong place, write 'ABANDON: <reason>' to
            $GITHUB_WORKSPACE/.loop/remediation.txt and change nothing further. Abandoning is a
            perfectly good outcome — a wrong PR on a third-party repo costs far
            more than a missing one.

          Do not argue with the reviewer in the PR. Never force-push. Do not open
          a pull request. No Co-Authored-By trailers.
          EOF
          )" < /dev/null --permission-mode acceptEdits \
            --output-format stream-json --verbose \
            --allowedTools "Bash Read Write Edit Glob Grep" \
            | python3 -u "$RUNNER_TEMP/fmt.py" 2>&1 | tail -20 || true

          r=$(head -1 $GITHUB_WORKSPACE/.loop/remediation.txt 2>/dev/null || echo "ABANDON: no result")
          echo "remediation: $r"
          case "$r" in
            FIXED*) echo "result=FIXED" >> "$GITHUB_OUTPUT" ;;
            *)      echo "result=ABANDON" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Re-review after remediation
        id: rereview
        if: steps.remediate.outputs.result == 'FIXED'
        working-directory: work
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          UPSTREAM: ${{ steps.cfg.outputs.upstream }}
          NUM: ${{ inputs.issue }}
          DEF: ${{ steps.fork.outputs.default_branch }}
        run: |
          # The agent call pipes into the stream formatter; without pipefail
          # the pipeline reports the formatter's status, which is always 0.
          set -o pipefail
          # Diff against the branch we were actually cut from, resolved once in
          # the checkout step, not guessed here.
          base=$(git merge-base HEAD "upstream/${DEF}" 2>/dev/null || echo "")
          if [ -n "$base" ]; then
            git diff "$base" HEAD > $GITHUB_WORKSPACE/.loop/change.diff
          else
            echo "::warning::no merge base with upstream/${DEF}; falling back to the last commit"
            git diff HEAD~1 HEAD > $GITHUB_WORKSPACE/.loop/change.diff || true
          fi
          echo "diff: $(git diff --name-only "${base:-HEAD~1}" HEAD | wc -l) file(s), $(wc -l < $GITHUB_WORKSPACE/.loop/change.diff) line(s) vs upstream/${DEF}"
          timeout 1200 claude -p "$(cat <<EOF
          You are re-reviewing ${UPSTREAM}#${NUM} after the author addressed an
          earlier BLOCK. The original objections are in $GITHUB_WORKSPACE/.loop/verdict.txt and the
          current diff is $GITHUB_WORKSPACE/.loop/change.diff.

          THIS IS A ONE-SHOT NON-INTERACTIVE SESSION. Never start a command in
          the background and then end your turn waiting for it — no later turn
          exists in which a notification can reach you. Run every check in the
          foreground.

          Check ONLY whether each original objection is genuinely resolved — do
          not invent new requirements. In particular re-verify that the test
          still fails without the source change. Write $GITHUB_WORKSPACE/.loop/verdict.txt with a
          first line of exactly 'APPROVE' or 'BLOCK' and your reasoning.
          EOF
          )" < /dev/null --permission-mode acceptEdits \
            --output-format stream-json --verbose \
            --allowedTools "Bash Read Glob Grep" 2>&1 \
            | python3 -u "$RUNNER_TEMP/fmt.py" | tail -40 || true

          v=$(head -1 $GITHUB_WORKSPACE/.loop/verdict.txt 2>/dev/null || echo "BLOCK")
          echo "re-review verdict: $v"
          case "$v" in
            APPROVE*) echo "verdict=APPROVE" >> "$GITHUB_OUTPUT" ;;
            *)        echo "verdict=BLOCK" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Open PR (only if the reviewer approved)
        if: steps.gen.outputs.outcome == 'READY' && (steps.review.outputs.verdict == 'APPROVE' || steps.rereview.outputs.verdict == 'APPROVE')
        working-directory: work
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPSTREAM: ${{ steps.cfg.outputs.upstream }}
          NUM: ${{ inputs.issue }}
          REPO_KEY: ${{ inputs.repo_key }}
          PREPARE_ONLY: ${{ steps.cfg.outputs.prepare_only }}
        run: |
          # Size ceiling, per repo. On openclaw this is the whole story: of our
          # eight PRs there the only one that merged is +38/-2, and the seven
          # still open are +47, +140, +189, +191, +287, +358 and +1234 — while
          # external PRs that land there run a median of +61. "Keep it minimal"
          # was advice in a prompt and produced a 1234-line patch, so it is a
          # gate now. Over the ceiling we do not open: a patch that large is not
          # going to merge there, and spending a maintainer's attention on it
          # costs goodwill we need for the small ones.
          case "${REPO_KEY}" in
            openclaw) max_added=120 ;;
            comfyui)  max_added=250 ;;
            *)        max_added=0 ;;
          esac
          if [ "${max_added}" -gt 0 ] && [ -f "$GITHUB_WORKSPACE/.loop/change.diff" ]; then
            added=$(grep -c '^+[^+]' "$GITHUB_WORKSPACE/.loop/change.diff" || true)
            added=${added:-0}
            if [ "$added" -gt "$max_added" ]; then
              echo "::warning::patch adds ${added} lines, over ${REPO_KEY}'s ${max_added}-line ceiling — not opening"
              echo "over_size=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "size ok: +${added} lines, ceiling ${max_added}"
          fi

          # Last-moment claim re-check. The pre-vet ran before the agent
          # session, which is bounded at 40 minutes — and on dify a competing
          # PR appears a median of 16 minutes after the issue is filed, often
          # from the reporter themselves. Opening on top of one is the single
          # rudest thing this pipeline can do, so pay one API call to avoid it.
          if gh api "repos/${UPSTREAM}/issues/${NUM}" --jq '.state' 2>/dev/null | grep -qi closed; then
            echo "::notice::${UPSTREAM}#${NUM} closed while we worked — not opening a PR"
            exit 0
          fi
          # A GraphQL error is not a rival. The first version piped the raw
          # response through jq without checking `.errors`, so an error body —
          # a non-empty string — was read as "there is a competing PR" and the
          # PR was silently dropped. dify#40144 passed the adversarial review
          # and was discarded that way, and the run still reported success.
          # Compounding it, NUM was absent from this step's env, so the query
          # asked for `issue(number:)` and could only ever error.
          rival_raw=$(gh api graphql -f query="{repository(owner:\"${UPSTREAM%%/*}\",name:\"${UPSTREAM##*/}\"){issue(number:${NUM}){
                        timelineItems(itemTypes:[CROSS_REFERENCED_EVENT],last:20){nodes{
                          ... on CrossReferencedEvent{source{... on PullRequest{number state author{login}}}}}}}}}" 2>/dev/null || true)
          if printf '%s' "$rival_raw" | grep -q '"errors"'; then
            echo "::warning::rival-PR check errored; opening the PR rather than dropping reviewed work"
            rival=""
          else
            rival=$(printf '%s' "$rival_raw" | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception: print(''); raise SystemExit
          n=(((d.get('data') or {}).get('repository') or {}).get('issue') or {})
          items=((n.get('timelineItems') or {}).get('nodes') or [])
          out=[str(s['number']) for i in items if (s:=(i or {}).get('source'))
               and s.get('number') and s.get('state')=='OPEN'
               and (s.get('author') or {}).get('login')!='chelsealong']
          print(','.join(out))" 2>/dev/null || true)
          fi
          if [ -n "${rival:-}" ]; then
            echo "::notice::${UPSTREAM}#${NUM} now has competing open PR(s) ${rival} — not opening ours"
            exit 0
          fi
          if [ "$PREPARE_ONLY" = "true" ]; then
            echo "::notice::prepare-only repo — branch pushed, no PR by policy"; exit 0
          fi
          BR=$(head -1 $GITHUB_WORKSPACE/.loop/branch.txt)
          TITLE=$(head -1 $GITHUB_WORKSPACE/.loop/pr-title.md)
          # Always target the real upstream: a fork-to-fork PR reaches no
          # maintainer, which has happened once already.
          gh pr create --repo "$UPSTREAM" --head "chelsealong:${BR}" \
            --title "$TITLE" --body-file $GITHUB_WORKSPACE/.loop/pr-body.md

      # Record SKIPs as well as BLOCKs. A BLOCK costs four agent sessions and was
      # always recorded; a SKIP costs one and was recorded nowhere, so the same
      # dead end was rediscovered from scratch every time — openclaw returned
      # "not a core bug, routes out of core" on two consecutive runs, and
      # spec-kit re-derived that "[Extension]: ..." catalog submissions are not
      # code changes. Those are exactly the durable corrections lessons exist for.
      - name: Record the skip as a durable lesson
        if: steps.gen.outputs.outcome == 'SKIP'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          reason=$(head -1 $GITHUB_WORKSPACE/.loop/outcome.txt 2>/dev/null || echo "")
          case "$reason" in
            ""|*"no outcome written"*|*"did not reach a conclusion"*)
              echo "::warning::generator produced no usable outcome - nothing worth recording"
              exit 0 ;;
          esac

          mkdir -p lessons
          f="lessons/${{ inputs.repo_key }}.md"
          line=$(printf -- "- [%s] #%s skipped: %s" "$(date -u +%Y-%m-%d)" \
                   "${{ inputs.issue }}" "$(printf '%s' "$reason" | sed 's/^SKIP: //' | cut -c1-260)")
          # Near-identical skips repeat; keep the file readable.
          if [ -s "$f" ] && grep -qF "$(printf '%s' "$line" | cut -c30-120)" "$f"; then
            echo "similar lesson already recorded"; exit 0
          fi
          printf '%s\n' "$line" >> "$f"

          git config user.name  "oss-pipeline[bot]"
          git config user.email "chelsealong@users.noreply.github.com"
          git add -A lessons
          git reset -q .loop 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -q -m "chore(lessons): ${{ inputs.repo_key }} #${{ inputs.issue }} skipped"
            # The checkout's GITHUB_TOKEN is contents:read, so `git push origin`
            # was rejected 403 ("denied to github-actions[bot]") on every single
            # run — the durable-corrections mechanism has never once worked from
            # CI. Push with the PAT, which is what talks to GitHub everywhere
            # else in this job.
            git remote set-url --push origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git pull --rebase -q origin main || true
            git push -q origin HEAD:main || echo "::warning::lesson push failed"
          fi

      - name: Record the block as a durable lesson
        if: steps.review.outputs.verdict == 'BLOCK' && steps.rereview.outputs.verdict != 'APPROVE'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "::warning::Adversarial reviewer BLOCKED this change - branch pushed, no PR opened"
          cat $GITHUB_WORKSPACE/.loop/verdict.txt 2>/dev/null || true

          # Turn the rejection into an input for the next run on this repo,
          # rather than letting the same mistake recur. One distilled line, not
          # the whole verdict — a lessons file that grows without bound stops
          # being read.
          mkdir -p lessons
          f="lessons/${{ inputs.repo_key }}.md"
          {
            printf -- "- [%s] issue #%s blocked by review: " \
              "$(date -u +%Y-%m-%d)" "${{ inputs.issue }}"
            sed -n '2,6p' $GITHUB_WORKSPACE/.loop/verdict.txt 2>/dev/null | tr '\n' ' ' | cut -c1-300
            printf "\n"
          } >> "$f"

          git config user.name  "oss-pipeline[bot]"
          git config user.email "chelsealong@users.noreply.github.com"
          git add -A lessons || true
          git reset -q .loop 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -q -m "chore(lessons): ${{ inputs.repo_key }} #${{ inputs.issue }} blocked by review"
            # The checkout's GITHUB_TOKEN is contents:read, so `git push origin`
            # was rejected 403 ("denied to github-actions[bot]") on every single
            # run — the durable-corrections mechanism has never once worked from
            # CI. Push with the PAT, which is what talks to GitHub everywhere
            # else in this job.
            git remote set-url --push origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git pull --rebase -q origin main || true
            git push -q origin HEAD:main || echo "::warning::lesson push failed"
          fi

      - name: Summary
        if: always()
        run: |
          # The whole outcome chain on one line. Diagnosing a run used to mean
          # grepping the raw log for "generator outcome:" and "verdict:", which
          # is how a quota block sat misread as a SKIP for weeks.
          echo "repo_key=${{ inputs.repo_key }} issue=#${{ inputs.issue }}"
          echo "resolved_ok=${{ steps.cfg.outputs.ok }} why=${{ steps.cfg.outputs.why }}"
          echo "over_daily_cap=${{ steps.cap.outputs.over }} dry_run=${{ inputs.dry_run }}"
          echo "prevet_taken=${{ steps.pre.outputs.taken }} ${{ steps.pre.outputs.why }}"
          echo "generator=${{ steps.gen.outputs.outcome }}"
          echo "review=${{ steps.review.outputs.verdict }} remediation=${{ steps.remediate.outputs.result }} rereview=${{ steps.rereview.outputs.verdict }}"
          {
            echo "### ${{ inputs.repo_key }} #${{ inputs.issue }}"
            echo ""
            echo "| stage | result |"
            echo "|---|---|"
            echo "| pre-vet | ${{ steps.pre.outputs.taken == 'true' && steps.pre.outputs.why || 'clear' }} |"
            echo "| generator | ${{ steps.gen.outputs.outcome || '-' }} |"
            echo "| review | ${{ steps.review.outputs.verdict || '-' }} |"
            echo "| remediation | ${{ steps.remediate.outputs.result || '-' }} |"
            echo "| re-review | ${{ steps.rereview.outputs.verdict || '-' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
