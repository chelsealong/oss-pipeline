name: Probe Claude auth on runner

# One-off diagnostic. Anthropic returns HTTP 403 to requests from consumer-VPN
# datacenter ranges (observed from AS60068 Datacamp), which is what breaks the
# local fixer. GitHub's runners are Azure address space — this checks whether
# Anthropic accepts them, because if it does, the Claude-dependent step can run
# here while detection stays local.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Egress IP and reachability
        run: |
          echo "--- egress ---"
          curl -sS --max-time 20 https://ipinfo.io/json || true
          echo
          echo "--- unauthenticated probe (401 = reachable, 403 = blocked) ---"
          curl -sS --max-time 20 -o /dev/null -w 'api.anthropic.com HTTP %{http_code}\n' \
            https://api.anthropic.com/v1/models || true

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Authenticate and run a trivial prompt
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "RESULT: no CLAUDE_CODE_OAUTH_TOKEN secret set"; exit 1
          fi
          out=$(claude -p "Reply with exactly: OK" 2>&1) || true
          echo "raw output: $out"
          # Check for failure FIRST, and match the whole reply rather than a
          # substring. On 2026-09-14 a token carrying a stray ellipsis was
          # rejected with "Invalid Authorization header value from
          # CLAUDE_CODE_OAUTH_TOKEN: ..." — and `*OK*` matched it, because
          # CLAUDE_CODE_OAUTH_TOKEN contains "OK" inside "TOKEN". The probe
          # reported SUCCESS for a token that could not authenticate at all,
          # which is the one thing a probe must never do.
          case "$out" in
            *"Invalid auth"*|*"Invalid Authorization"*|*"Failed to authenticate"*|*401*)
              echo "RESULT: AUTH FAILED - the token is not usable"; exit 1 ;;
            *403*)
              echo "RESULT: BLOCKED - runner IP rejected (403)"; exit 1 ;;
          esac
          # Success is an exact reply, not a substring found anywhere.
          if [ "$(printf '%s' "$out" | tr -d '[:space:]')" = "OK" ]; then
            echo "RESULT: SUCCESS - Claude authenticated and replied on this runner"
          else
            echo "RESULT: OTHER FAILURE - reply was not exactly OK; see raw output above"
            exit 1
          fi
