name: Hermes November 28 service identity validation
on:
  push:
    branches: [validation/adk7335-nov28]
    paths: [.github/workflows/hermes-nov28-validation.yml]
permissions:
  contents: read
jobs:
  identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Allow long checkout paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          repository: chelsealong/hermes-agent
          ref: d9e38cedde46c3fff464fa678983daaace747b96
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build isolated upstream test environment
        shell: bash
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/hermes-runtime
        run: |
          python -m pm.build_env --source . --out .venv --group dev --group test
          python -c "import os,pathlib; p=pathlib.Path('.venv') / ('Scripts/python.exe' if os.name=='nt' else 'bin/python'); f=open(os.environ['GITHUB_ENV'],'a'); print('HERMES_PYTHON='+str(p.absolute()),file=f); f.close()"
      - name: Run actual host identity and discovery regressions
        shell: bash
        run: |
          scripts/run_tests.sh tests/hermes_cli/test_gateway_profile_service_identity.py tests/hermes_cli/test_gateway_runtime_service_roots.py tests/hermes_cli/test_gateway_service_owner.py
      - name: Linux service and fleet suite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/run_tests.sh tests/hermes_cli/test_gateway_service.py tests/hermes_cli/test_gateway_runtime_service.py tests/hermes_cli/test_gateway_runtime_service_detail.py tests/hermes_cli/test_gateway_runtime_service_legacy_task.py tests/hermes_cli/test_update_launchd_fleet_restart.py
