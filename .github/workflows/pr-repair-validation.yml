name: Isolated PR repair validation
permissions:
  contents: read
jobs:
  openclaw:
    name: 'OpenClaw #${{ matrix.pr }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - pr: 191615
          ref: 96e87a5edb2c008b3568faffc97dd1893d78fc26
          files: docs/concepts/models.md src/gateway/session-observer-completion.test.ts src/gateway/session-observer-completion.ts
          tests: src/gateway/session-observer-completion.test.ts
          test_command: pnpm test $TEST_PATHS --maxWorkers=1
        - pr: 198173
          ref: 9070ed7a5c7f958b4790afa8e3e69620d6209bfe
          files: docs/web/control-ui/chat.md packages/gateway-protocol/src/schema/tools-catalog.ts src/agents/agent-bundle-mcp-runtime-config.test.ts
            src/agents/agent-bundle-mcp-runtime-config.ts src/agents/tools-effective-inventory.cold-provider.test.ts
            src/gateway/server-methods/tools-effective.test-support.ts src/gateway/server-methods/tools-effective.test.ts
            src/gateway/server-methods/tools-effective.ts ui/src/pages/chat/components/chat-composer-menu.test.tsx
            ui/src/pages/chat/components/chat-composer-plugins-menu.tsx
          tests: src/agents/agent-bundle-mcp-runtime-config.test.ts src/agents/tools-effective-inventory.cold-provider.test.ts
            src/gateway/server-methods/tools-effective.test.ts ui/src/pages/chat/components/chat-composer-menu.test.tsx
          test_command: pnpm test $TEST_PATHS --maxWorkers=1
    steps:
    - uses: actions/checkout@v4
      with:
        repository: chelsealong/openclaw
        ref: ${{ matrix.ref }}
        persist-credentials: false
    - name: Focused isolated Node validation
      env:
        TEST_PATHS: ${{ matrix.tests }}
        CHANGED_FILES: ${{ matrix.files }}
        TEST_COMMAND: ${{ matrix.test_command }}
      run: "docker run --rm -v \"$GITHUB_WORKSPACE:/work\" -w /work -e TEST_PATHS -e CHANGED_FILES -e TEST_COMMAND\
        \ node:24.22.1-bookworm bash -euc '\n npm install -g pnpm@12.15.0\n pnpm install --frozen-lockfile\n eval\
        \ \"$TEST_COMMAND\"\n pnpm exec oxfmt --check $CHANGED_FILES\n'\n"
  postgres:
    name: 'OpenClaw #197795 PostgreSQL restore'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: repair
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: repair
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U repair" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
    - uses: actions/checkout@v4
      with:
        repository: chelsealong/openclaw
        ref: 254c064b0667a3bef7d1e15e3ed97d116b148384
        persist-credentials: false
    - name: Validate restore with isolated PostgreSQL
      run: "docker run --rm --network host -v \"$GITHUB_WORKSPACE:/work\" -w /work node:24.22.1-bookworm bash -euc\
        \ '\n npm install -g pnpm@12.15.0\n pnpm install --frozen-lockfile\n node --import ./scripts/tsx.mjs scripts/test-database-conformance.mjs\
        \ --engine postgres --connection postgres://repair:isolated-test-only@localhost:5432/repair -- src/infra/database-engine/archive-restore.postgres.test.ts\
        \ --maxWorkers=1\n pnpm exec oxfmt --check src/infra/database-engine/archive-restore.postgres.test.ts src/commands/backup-restore.ts\n\
        '\n"
'on':
  push:
    branches:
    - codex/pr-repair-validation-20261118
    paths:
    - .github/workflows/pr-repair-validation.yml
