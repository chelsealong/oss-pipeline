name: Isolated PR repair validation
permissions:
  contents: read
jobs:
  hermes:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        repository: chelsealong/hermes-agent
        ref: ${{ matrix.ref }}
        persist-credentials: false
        fetch-depth: 20
    - name: Fetch frozen upstream audit base
      run: 'git fetch --depth=1 https://github.com/NousResearch/hermes-agent.git f7e2898aaefc8f967dbf7345e3999a65672fe60e

        git update-ref refs/remotes/origin/main FETCH_HEAD'
    - name: Validate Hermes repair without production credentials
      run: "docker run --rm -v \"$GITHUB_WORKSPACE:/work\" -w /work -e TEST_PATHS python:3.12-bookworm bash -euc '\n  git\
        \ config --global --add safe.directory /work\n  python -m pm.build_env --source . --out /opt/test-env --group dev\
        \ --group test\n  export HERMES_PYTHON=/opt/test-env/bin/python\n  bash scripts/run_tests.sh -j 2 $TEST_PATHS -q\n\
        \  /opt/test-env/bin/python scripts/check --base f7e2898aaefc8f967dbf7345e3999a65672fe60e\n'\n"
      env:
        TEST_PATHS: ${{ matrix.tests }}
    name: 'Hermes #${{ matrix.pr }}'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - pr: 76514
          ref: 47bd1a2e6aab41235dd10ae2d5e72c977291aab3
          tests: tests/gateway/test_kanban_notifier.py tests/hermes_cli/test_kanban_cli.py
        - pr: 81134
          ref: ae64243e9ac030597143a9fdaddc76c5734bc8df
          tests: tests/tools/test_threat_patterns.py tests/tools/test_skills_guard.py tests/cron/test_cron_prompt_injection.py
            tests/cron/test_cron_prompt_injection_skill.py
  openclaw-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        repository: chelsealong/openclaw
        ref: dfe64df7781d121921e7700e06a6f1bb909386b9
        persist-credentials: false
    - name: Check documentation
      run: "docker run --rm -v \"$GITHUB_WORKSPACE:/work\" -w /work node:24.22.1-bookworm-slim sh -euc '\n npm install --prefix\
        \ /tmp/formatter --ignore-scripts --no-audit --no-fund oxfmt@0.74.0\n /tmp/formatter/node_modules/.bin/oxfmt --check\
        \ .agents/skills/test-audit/SKILL.md .agents/skills/test-audit/references/audit.md\n test -f .agents/skills/test-audit/references/audit.md\n\
        '\n"
  openclaw:
    name: 'OpenClaw #${{ matrix.pr }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - pr: 142692
          ref: e98d17de0ba8f5029b622b531aea71a6c049779f
          tests: src/meeting-bot/agent-consult.test.ts
          files: src/meeting-bot/agent-consult.test.ts src/meeting-bot/agent-consult.ts
        - pr: 150063
          ref: 715c2670dee38b567087e63faba0f2eef6388f65
          tests: src/secrets/runtime.fast-path.test.ts
          files: src/secrets/runtime-auth-store-admission.ts src/secrets/runtime.fast-path.test.ts
    steps:
    - uses: actions/checkout@v4
      with:
        repository: chelsealong/openclaw
        ref: ${{ matrix.ref }}
        persist-credentials: false
    - name: Focused isolated Node validation
      env:
        TEST_PATHS: ${{ matrix.tests }}
        CHANGED_FILES: ${{ matrix.files }}
      run: "docker run --rm -v \"$GITHUB_WORKSPACE:/work\" -w /work -e TEST_PATHS -e CHANGED_FILES node:24.22.1-bookworm bash\
        \ -euc '\n npm install -g pnpm@12.15.0\n pnpm install --frozen-lockfile\n pnpm test $TEST_PATHS --maxWorkers=1\n pnpm\
        \ exec oxfmt --check $CHANGED_FILES\n'\n"
'on':
  push:
    branches:
    - codex/pr-repair-validation-20261118
    paths:
    - .github/workflows/pr-repair-validation.yml
