name: Isolated PR repair validation
permissions:
  contents: read
jobs:
  adk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - pr: 7244
          ref: d21d187a704a3c5eeab7520dca48a5b47a66ac10
          sdk: a2a-sdk[http-server]>=1,<2
          tests: tests/unittests/telemetry/test_spans.py
          files: src/google/adk/telemetry/tracing.py tests/unittests/telemetry/test_spans.py
    steps:
    - uses: actions/checkout@v4
      with:
        repository: chelsealong/adk-python
        ref: ${{ matrix.ref }}
        persist-credentials: false
    - name: Test reviewed ADK patch in a credential-free container
      env:
        A2A_SDK: ${{ matrix.sdk }}
        TEST_PATHS: ${{ matrix.tests }}
        CHANGED_PY: ${{ matrix.files }}
      run: "docker run --rm -v \"$GITHUB_WORKSPACE:/work\" -w /work -e A2A_SDK -e TEST_PATHS -e CHANGED_PY \\\n  python:3.12-slim\
        \ bash -euc '\n    pip install --disable-pip-version-check -q -e \".[a2a]\" \"$A2A_SDK\" pytest pytest-asyncio pytest-mock\
        \ pyink isort mcp \"opentelemetry-instrumentation-google-genai>=0.7b1,<2\" \"google-cloud-discoveryengine>=0.13.12,<0.14\"\
        \n    python -m pytest $TEST_PATHS -q\n    pyink --check $CHANGED_PY\n    isort --check-only $CHANGED_PY\n  '\n"
    name: 'ADK #${{ matrix.pr }} (${{ matrix.sdk }})'
  hermes:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        repository: chelsealong/hermes-agent
        ref: ${{ matrix.ref }}
        persist-credentials: false
        fetch-depth: 20
    - name: Fetch frozen upstream audit base
      run: 'git fetch --depth=1 https://github.com/NousResearch/hermes-agent.git f7e2898aaefc8f967dbf7345e3999a65672fe60e

        git update-ref refs/remotes/origin/main FETCH_HEAD'
    - name: Validate Hermes repair without production credentials
      run: "docker run --rm -v \"$GITHUB_WORKSPACE:/work\" -w /work -e TEST_PATHS python:3.12-bookworm bash -euc '\n  git\
        \ config --global --add safe.directory /work\n  python -m pm.build_env --source . --out /opt/test-env --group dev\
        \ --group test\n  export HERMES_PYTHON=/opt/test-env/bin/python\n  bash scripts/run_tests.sh -j 2 $TEST_PATHS -q\n\
        \  /opt/test-env/bin/python scripts/check --base f7e2898aaefc8f967dbf7345e3999a65672fe60e\n'\n"
      env:
        TEST_PATHS: ${{ matrix.tests }}
    name: 'Hermes #${{ matrix.pr }}'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - pr: 76514
          ref: 9136de85d515201c4916d73f1f8fd9c0daa71267
          tests: tests/gateway/test_kanban_notifier.py tests/hermes_cli/test_kanban_cli.py
        - pr: 81134
          ref: c2bcb50a1731f9b049933bbb21d33db2d265b541
          tests: tests/tools/test_threat_patterns.py tests/tools/test_skills_guard.py tests/cron/test_cron_prompt_injection.py
            tests/cron/test_cron_prompt_injection_skill.py
'on':
  push:
    branches:
    - codex/pr-repair-validation-20261118
    paths:
    - .github/workflows/pr-repair-validation.yml
