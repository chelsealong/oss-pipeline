name: Isolated PR repair validation
permissions:
  contents: read
jobs:
  openclaw:
    name: 'OpenClaw #${{ matrix.pr }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
        - pr: 150063
          ref: eb81c7140a2090b75167c7055cf1c3510e60b7ad
          files: src/secrets/runtime-auth-store-admission.ts src/secrets/runtime.fast-path.test.ts
          tests: ''
          test_command: 'true'
          lint_files: src/secrets/runtime-auth-store-admission.ts src/secrets/runtime.fast-path.test.ts
          tsconfig: .pr-repair-test-types.json
          prepare_types: 'printf %s ''{"extends": "./test/tsconfig/tsconfig.test.json", "include": ["src/**/*.d.ts",
            "ui/**/*.d.ts", "packages/**/*.d.ts", "test/types/**/*.d.ts", "src/secrets/runtime-auth-store-admission.ts",
            "src/secrets/runtime.fast-path.test.ts"]}'' > .pr-repair-test-types.json'
    steps:
    - uses: actions/checkout@v4
      with:
        repository: chelsealong/openclaw
        ref: ${{ matrix.ref }}
        persist-credentials: false
    - name: Focused isolated Node validation
      env:
        TEST_PATHS: ${{ matrix.tests }}
        CHANGED_FILES: ${{ matrix.files }}
        TEST_COMMAND: ${{ matrix.test_command }}
        LINT_FILES: ${{ matrix.lint_files }}
        TYPE_CONFIG: ${{ matrix.tsconfig }}
        PREPARE_TYPES: ${{ matrix.prepare_types }}
      run: "docker run --rm -v \"$GITHUB_WORKSPACE:/work\" -w /work -e TEST_PATHS -e CHANGED_FILES -e TEST_COMMAND\
        \ -e LINT_FILES -e TYPE_CONFIG -e PREPARE_TYPES node:24.22.1-bookworm bash -euc '\n npm install -g pnpm@12.15.0\n\
        \ pnpm install --frozen-lockfile\n eval \"$TEST_COMMAND\"\n pnpm exec oxfmt --check $CHANGED_FILES\n pnpm\
        \ exec oxlint $LINT_FILES\n eval \"$PREPARE_TYPES\"\n node scripts/run-tsgo.mjs -p \"$TYPE_CONFIG\" --noEmit\n\
        '\n"
'on':
  push:
    branches:
    - codex/pr-repair-validation-20261118
    paths:
    - .github/workflows/pr-repair-validation.yml
