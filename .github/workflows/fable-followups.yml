{
  "name": "Fable follow-up validation",
  "on": {
    "push": {
      "branches": [
        "validation/fable-followups-nov29"
      ],
      "paths": [
        ".github/workflows/fable-followups.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 40,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 3,
        "matrix": {
          "include": [
            {
              "pr": 191745,
              "ref": "d465e50e1e8889d2a97e3cae71e076d48e113f03",
              "files": "extensions/voice-call/index.test.ts extensions/voice-call/index.ts extensions/voice-call/src/call-delivery-runtime.ts extensions/voice-call/src/runtime.ts extensions/voice-call/src/service-delivery-context.test.ts extensions/voice-call/src/service-delivery-context.ts src/plugins/service-scheduler-context.ts src/plugins/services.scheduler-context.test.ts src/plugins/services.ts",
              "lint_files": "extensions/voice-call/index.test.ts extensions/voice-call/index.ts extensions/voice-call/src/call-delivery-runtime.ts extensions/voice-call/src/runtime.ts extensions/voice-call/src/service-delivery-context.test.ts extensions/voice-call/src/service-delivery-context.ts src/plugins/service-scheduler-context.ts src/plugins/services.scheduler-context.test.ts src/plugins/services.ts",
              "test_command": "pnpm test src/gateway/server-plugin-reload.recovery.test.ts --maxWorkers=1",
              "prepare_types": "printf '%s' '{\"extends\": \"./test/tsconfig/tsconfig.test.json\", \"include\": [\"src/**/*.d.ts\", \"ui/**/*.d.ts\", \"packages/**/*.d.ts\", \"test/types/**/*.d.ts\", \"extensions/voice-call/index.test.ts\", \"extensions/voice-call/index.ts\", \"extensions/voice-call/src/call-delivery-runtime.ts\", \"extensions/voice-call/src/runtime.ts\", \"extensions/voice-call/src/service-delivery-context.test.ts\", \"extensions/voice-call/src/service-delivery-context.ts\", \"src/plugins/service-scheduler-context.ts\", \"src/plugins/services.scheduler-context.test.ts\", \"src/plugins/services.ts\"]}' > .fable-types.json"
            }
          ]
        }
      },
      "name": "PR ${{ matrix.pr }}",
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "chelsealong/openclaw",
            "ref": "${{ matrix.ref }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Isolated focused tests and static checks",
          "env": {
            "TEST_COMMAND": "${{ matrix.test_command }}",
            "CHANGED_FILES": "${{ matrix.files }}",
            "LINT_FILES": "${{ matrix.lint_files }}",
            "PREPARE_TYPES": "${{ matrix.prepare_types }}"
          },
          "run": "docker run --rm -v \"$GITHUB_WORKSPACE:/work\" -w /work -e TEST_COMMAND -e CHANGED_FILES -e LINT_FILES -e PREPARE_TYPES node:24.22.1-bookworm bash -euc '\nnpm install -g pnpm@12.15.0\npnpm install --frozen-lockfile\neval \"$TEST_COMMAND\"\npnpm exec oxfmt --check $CHANGED_FILES\npnpm exec oxlint $LINT_FILES\neval \"$PREPARE_TYPES\"\nnode scripts/run-tsgo.mjs -p .fable-types.json --noEmit\n' "
        }
      ]
    }
  }
}
