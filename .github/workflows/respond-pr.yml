name: Respond to PR feedback

# Dispatched by the local watch-prs.py when a reviewer leaves genuinely new
# feedback on one of our open PRs. Runs here rather than on the Mac because
# Anthropic returns 403 to that machine's VPN exit (AS60068 Datacamp) and
# `claude -p` cannot run there; runners exit AS8075 Microsoft and are accepted.
#
# An unanswered review request stalls a PR indefinitely, which is the difference
# between a PR that merges and one that rots.
on:
  workflow_dispatch:
    inputs:
      upstream:
        description: 'Upstream repo, e.g. openclaw/openclaw'
        required: true
      pr:
        description: 'PR number'
        required: true
      dry_run:
        description: 'Gather the feedback and print the plan; change nothing'
        type: boolean
        default: false

concurrency:
  group: oss-respond-${{ inputs.upstream }}-${{ inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Collect the PR and its feedback
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          UP="${{ inputs.upstream }}"; N="${{ inputs.pr }}"
          gh pr view "$N" --repo "$UP" \
            --json number,title,url,headRefName,state,labels,body \
            > /tmp/pr.json
          echo "head=$(jq -r .headRefName /tmp/pr.json)" >> "$GITHUB_OUTPUT"
          echo "state=$(jq -r .state /tmp/pr.json)" >> "$GITHUB_OUTPUT"

          # Whose branch is it now? watch-prs.py refuses to dispatch at a PR a
          # maintainer has taken over, but that decision is made minutes before
          # this runs and manual dispatches skip it entirely. openclaw#117176
          # was validated at 120/120 green by vincentkoc, who then rebased it
          # and added two commits of their own; the responder was already in
          # flight and had to be killed by hand. Re-check here, and again
          # before pushing.
          OWNER=$(gh api "repos/$UP/pulls/$N/commits" --paginate \
                    --jq '.[-1].author.login' 2>/dev/null | tail -1)
          echo "branch_owner=${OWNER:-unknown}" >> "$GITHUB_OUTPUT"
          if [ -n "$OWNER" ] && [ "$OWNER" != "chelsealong" ]; then
            echo "::warning::newest commit on $UP#$N is by $OWNER, not us — standing down"
            echo "state=TAKEN_OVER" >> "$GITHUB_OUTPUT"
          fi

          # Everything a reviewer might have said, newest last.
          #
          # Bounded per section. One real run produced a 1325-line context and
          # there was no way to tell afterwards which section was responsible,
          # because only the total was ever printed. Each section is now capped
          # at its newest content — a bot's coverage table is not worth more
          # room than the maintainer's actual request — and its size is logged,
          # so "the context got huge" is a measurement instead of a suspicion.
          {
            echo "### [ctx] PR body"; jq -r '.body // "(empty)"' /tmp/pr.json | head -100
            echo; echo "### [ctx] Labels"; jq -r '[.labels[].name] | join(", ")' /tmp/pr.json
            echo; echo "### [ctx] Issue comments"
            { gh api "repos/$UP/issues/$N/comments" \
              --jq '.[] | "--- \(.user.login) at \(.created_at) ---\n\(.body)"' || true; } | tail -200
            echo; echo "### [ctx] Reviews"
            { gh api "repos/$UP/pulls/$N/reviews" \
              --jq '.[] | "--- \(.user.login) \(.state) at \(.submitted_at) ---\n\(.body // "(no body)")"' || true; } | tail -150
            echo; echo "### [ctx] Inline review comments"
            { gh api "repos/$UP/pulls/$N/comments" \
              --jq '.[] | "--- \(.user.login) on \(.path):\(.line // 0) ---\n\(.body)"' || true; } | tail -150
            echo; echo "### [ctx] Failing checks"
            gh pr checks "$N" --repo "$UP" 2>/dev/null | grep -viE '\bpass\b|skipping' || echo "(none)"
            # Names alone are not enough to fix anything. Pull the tail of each
            # failing Actions job so the agent sees the assertion, not just that
            # something went red. Non-Actions checks (Vercel, codecov) have no
            # log we can read and are filtered out by the watcher anyway.
            # A name cannot say whose failure it is. `integration_test` on
            # AutoGPT and `check-sqlite-session-flip-proof` on openclaw both
            # failed on our PRs AND on other people's on the same day, while
            # passing on others — content-dependent, not universally broken, and
            # not decidable from the name. Give the agent the base rate and let
            # it judge with the log in front of it.
            # Split by fork vs same-repo, because that is the split that
            # actually discriminates. openclaw's check-sqlite-session-flip-proof
            # passed on 14 of 14 same-repo PRs and failed on 5 of 7 forks
            # (including all three of ours) — pooled, that reads as a 5% base
            # rate and looks like our bug. It is the same phenomenon as Vercel
            # and codecov on AutoGPT: a check that cannot pass from a fork.
            echo; echo "### [ctx] Same check on other people's open PRs (base rate)"
            { gh pr checks "$N" --repo "$UP" --json name,state \
                --jq '.[] | select(.state=="FAILURE") | .name' 2>/dev/null || true; } \
              | sed -n '1,6p' | while read -r cname; do
                  [ -z "$cname" ] && continue
                  fp=0; ff=0; sp=0; sf=0
                  while IFS="|" read -r osha orepo; do
                    [ -z "$osha" ] && continue
                    # Capture first, then take the first line. Piping a
                    # still-paginating `gh` into `head` sends it SIGPIPE and
                    # exit 141 kills the step under pipefail.
                    all_c=$(gh api "repos/$UP/commits/$osha/check-runs?per_page=100" --paginate \
                              --jq ".check_runs[] | select(.name==\"$cname\") | .conclusion" 2>/dev/null || true)
                    c=$(printf '%s\n' "$all_c" | sed -n 1p)
                    if [ "$orepo" = "$UP" ]; then
                      case "$c" in success) sp=$((sp+1));; failure|timed_out) sf=$((sf+1));; esac
                    else
                      case "$c" in success) fp=$((fp+1));; failure|timed_out) ff=$((ff+1));; esac
                    fi
                  done <<< "$(gh api "repos/$UP/pulls?state=open&per_page=30&sort=created&direction=desc" \
                                --jq ".[] | select(.user.login != \"chelsealong\") | \"\(.head.sha)|\(.head.repo.full_name)\"" \
                                2>/dev/null | head -20)"
                  echo "  $cname: same-repo PRs fail $sf/$((sp+sf)); FORK PRs fail $ff/$((fp+ff))"
                  if [ $((sp+sf)) -gt 3 ] && [ "$sf" -eq 0 ] && [ "$ff" -gt 0 ]; then
                    echo "    ^ passes for everyone pushing to the repo directly and fails only from forks."
                    echo "      That is an infrastructure limitation, not a defect in this PR. Say so on"
                    echo "      the PR in one sentence and change no code for it."
                  fi
                done

            echo; echo "### [ctx] Failing check logs"
            # `gh pr checks` exits 8 when any check is failing — which is
            # precisely when this runs — and the step is `set -euo pipefail`,
            # so it must not be the last command in a pipeline.
            # Two link shapes, and the second was being dropped entirely:
            #   .../actions/runs/<run>/job/<job>   a workflow job -> read its log
            #   .../runs/<check_run_id>            a check run    -> read its
            #                                      annotations, which is where
            #                                      scanners put their findings.
            # CodeQL uses the second, so its six high-severity alerts on
            # AutoGPT#13752 were invisible to the responder: nothing about them
            # appears in the job log at all.
            { gh pr checks "$N" --repo "$UP" --json name,state,link \
                --jq '.[] | select(.state=="FAILURE") | "\(.name)\t\(.link)"' \
                2>/dev/null || true; } | while IFS=$'\t' read -r cname link; do
                case "$link" in
                  */actions/runs/*/job/*) job="${link##*/job/}"; job="${job%%\?*}" ;;
                  */runs/[0-9]*)
                    cr="${link##*/runs/}"; cr="${cr%%\?*}"
                    echo "--- $cname (check run $cr) ---"
                    gh api "repos/$UP/check-runs/$cr" \
                      --jq '"  " + (.output.title // "") + "\n" + ((.output.summary // "")[0:600])' 2>/dev/null || true
                    gh api "repos/$UP/check-runs/$cr/annotations" \
                      --jq '.[] | "  \(.annotation_level) \(.path):\(.start_line) \(.title // "")\n    \((.message // "")[0:300])"' \
                      2>/dev/null | sed -n '1,60p' || true
                    continue ;;
                  *) continue ;;
                esac
                [ -z "$job" ] && continue
                echo "--- $cname (job $job) ---"
                # NOT the tail: a job's last 60 lines are post-job cleanup
                # ("Removing credentials config", "Cleaning up orphan
                # processes"). The failure sits in the middle, so anchor on the
                # ##[error] marker and take what precedes it. Timestamps are
                # stripped — 28 characters per line of pure noise.
                { gh api "repos/$UP/actions/jobs/$job/logs" 2>/dev/null \
                    | sed 's/^[0-9][0-9-]*T[0-9:.]*Z //' \
                    | grep -aE -B25 '##\[error\]' | tail -40 | cut -c1-300; } \
                  || echo "(log not readable — forks cannot read org-required workflow logs)"
              done
          } > /tmp/feedback.txt

          # Per-section sizes, so a runaway section is visible in the run log.
          awk '/^### \[ctx\] /{if(s)printf "  %-24s %4d lines\n", s, n; s=substr($0,11); n=0; next}{n++}
               END{if(s)printf "  %-24s %4d lines\n", s, n}' /tmp/feedback.txt
          total=$(wc -l < /tmp/feedback.txt)
          echo "  TOTAL $total lines"
          if [ "$total" -gt 900 ]; then
            echo "::warning::feedback context is ${total} lines; check which section grew"
          fi

      - name: Checkout the PR branch from the fork
        if: steps.ctx.outputs.state == 'OPEN' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          UP="${{ inputs.upstream }}"; NAME="${UP##*/}"
          git clone --depth 50 --branch "${{ steps.ctx.outputs.head }}" \
            "https://x-access-token:${GH_TOKEN}@github.com/chelsealong/${NAME}.git" work
          cd work
          git remote add upstream "https://github.com/${UP}.git"
          git fetch --depth 50 upstream
          # The CLA bot matches the COMMIT EMAIL; this is the address on the CLA.
          git config user.name  "chelsealong"
          git config user.email "chelsealong@126.com"

      - name: Install Claude Code
        if: steps.ctx.outputs.state == 'OPEN' && inputs.dry_run != true
        run: npm install -g @anthropic-ai/claude-code

      - name: Address the feedback
        if: steps.ctx.outputs.state == 'OPEN' && inputs.dry_run != true
        working-directory: work
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ALT_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UP: ${{ inputs.upstream }}
          N: ${{ inputs.pr }}
          BRANCH: ${{ steps.ctx.outputs.head }}
        run: |
          cat > "$RUNNER_TEMP/fmt.py" <<'FMT'
          import json, sys
          try:
              for line in sys.stdin:
                  try:
                      ev = json.loads(line)
                  except ValueError:
                      # Never swallow an unparsed line: the session-limit notice
                      # is plain text and the quota guard greps this stream.
                      print(line, end="", flush=True)
                      continue
                  for blk in (ev.get("message") or {}).get("content") or []:
                      kind = blk.get("type")
                      if kind == "tool_use":
                          a = blk.get("input") or {}
                          d = a.get("command") or a.get("file_path") or a.get("pattern") or ""
                          nm = blk.get("name")
                          print("  [" + str(nm) + "] " + str(d)[:150], flush=True)
                      elif kind == "text" and blk.get("text", "").strip():
                          print(blk["text"][:400], flush=True)
                  if ev.get("type") == "result":
                      print("  [result] " + str(ev.get("subtype")) +
                            " turns=" + str(ev.get("num_turns")), flush=True)
          except BrokenPipeError:
              pass
          FMT

          # The agent call is now a pipeline (claude | formatter). Without
          # pipefail its status would be the formatter's, i.e. always 0, and the
          # retry and quota branches below would never fire.
          set -o pipefail
          cp /tmp/feedback.txt ./FEEDBACK.txt
          run_claude() {
          # Bounded like fix-one.yml's calls. This one was missed: a hung
          # session here burned to the 60-minute job timeout with nothing
          # to show for it. Observed healthy runs take 1-18 minutes.
          timeout 2400 claude -p "$(cat <<EOF
          Reviewer feedback has arrived on our own pull request ${UP}#${N}. Decide
          what it actually asks for and do that — nothing more.

          The full thread is in ./FEEDBACK.txt in this working directory (PR body,
          labels, issue comments, reviews, inline comments, failing checks). READ IT
          FIRST. This checkout is branch '${BRANCH}' of our fork, with 'upstream'
          pointing at ${UP}. Git identity is already correct. Delete FEEDBACK.txt
          before committing — it must never be part of the diff.

          Classify the newest feedback, then act:

          A. ASKS FOR A CODE CHANGE — make the minimal change requested. Keep or add
             tests, and prove the test fails without the fix: the fix will be
             committed, so 'git stash' does nothing — use
             'git checkout HEAD~1 -- <source file>', run the test, confirm failure,
             then 'git checkout HEAD -- <source file>'. Run the repo's real lint and
             test commands. Commit and push to the SAME branch (new commits, never a
             force-push). Then reply on the PR, briefly, saying what you changed.

          B. ASKS FOR EVIDENCE OR PROOF — do not change code. Produce the evidence
             the reviewer asked for by actually running things in this checkout, then
             update the PR body with it via 'gh pr edit ${N} --repo ${UP} --body ...',
             preserving the existing body and adding the evidence. Post real command
             output, never invented output. If the environment genuinely cannot
             produce it (needs a GPU, a live service, credentials), say exactly that
             in a reply instead of faking it.

          C. ASKS A QUESTION — answer it in one short, factual reply, citing file
             paths and line numbers.

          D. STATUS ONLY (CI result, bot notice, an approval with no request) — do
             nothing at all and say so.

          A MAINTAINER'S EXPLICIT REQUEST IS AUTHORISATION. If a maintainer asks
          for something concrete — port this to another branch, split it, add a
          test, open a follow-up — do it, even when that means work outside this
          one PR (a new branch off a release line, a second PR). Do not stop to
          ask permission for what they just asked for. On #6531 a maintainer said
          "the fix works, can we please port to 1.x as well" and the responder
          declined as out of scope; that was wrong, and the port had to be done
          by hand. Only decline if the request would breach one of the hard rules
          below or the repo's own contribution policy.

          NEVER SPEAK FOR THE HUMAN. Do not claim that a person reviewed, tested,
          or approved anything. Disclose AI involvement honestly when asked, and
          state only what you yourself did.

          HARD RULES:
          * Never argue with a reviewer. If you believe the feedback is mistaken,
            do NOT push back — stop, change nothing, and explain your reasoning in
            your final report to the human instead.
          * Never force-push. Never merge. Never close the PR.
          * Commit messages must NOT contain any Co-Authored-By trailer, and never
            'Co-Authored-By: ... <noreply@anthropic.com>'. A CLA bot counts it as a
            second contributor with no CLA and fails the whole check; adk-python#6516
            sat red for hours on exactly that.
          * One reply maximum. Be concise and specific; no restating the review back.
          * If the thread shows the reviewer already got what they asked for, do
            nothing rather than adding noise.

          Finish with one paragraph: which category you chose, what you changed or
          posted, and the evidence — or why doing nothing was right.
          EOF
          )" < /dev/null --permission-mode acceptEdits \
            --output-format stream-json --verbose \
            --allowedTools "Bash Read Write Edit Glob Grep WebFetch" \
            | python3 -u "$RUNNER_TEMP/fmt.py"
          }

          # Two bugs shared with fix-one.yml. `cmd | tee` reports tee's exit
          # status, which is always 0, so this loop exited on the first pass no
          # matter what and the retry never ran. And `claude -p` exits 0 while
          # printing "You've hit your session limit", so a quota block was
          # recorded as a delivered response — watch-prs.py marks feedback seen
          # at dispatch and never re-offers it, so the maintainer's comment would
          # simply go unanswered, silently. Fail loudly instead.
          switched_token=0
          for attempt in 1 2 3 4; do
            start=$(date +%s)
            run_claude 2>&1 | tee /tmp/claude.out; rc=${PIPESTATUS[0]}

            if grep -qi 'session limit' /tmp/claude.out 2>/dev/null; then
              # Unlike a fix, an unanswered review comment cannot wait an hour
              # for a reset — the PR stalls meanwhile. Try the spare account, and
              # if that is dry too, fail loudly rather than pretend we replied.
              if [ -n "${ALT_OAUTH_TOKEN:-}" ] && [ "$switched_token" -eq 0 ]; then
                echo "::notice::primary subscription out of quota - switching to the second account"
                export CLAUDE_CODE_OAUTH_TOKEN="$ALT_OAUTH_TOKEN"
                switched_token=1
                continue
              fi
              echo "::warning::SESSION LIMIT on every account - this reviewer feedback went UNANSWERED"
              rm -f FEEDBACK.txt; exit 1
            fi

            [ "$rc" -eq 0 ] && { rm -f FEEDBACK.txt; exit 0; }
            elapsed=$(( $(date +%s) - start ))
            if [ "$elapsed" -gt 60 ]; then
              echo "failed after ${elapsed}s - not retrying (may have done partial work)"
              rm -f FEEDBACK.txt; exit 1
            fi
            [ "$attempt" -eq 3 ] && { echo "giving up"; rm -f FEEDBACK.txt; exit 1; }
            echo "attempt $attempt failed in ${elapsed}s; retrying in $((30 * attempt))s"
            sleep $((30 * attempt))
          done

      - name: Summary
        if: always()
        run: |
          echo "pr=${{ inputs.upstream }}#${{ inputs.pr }} state=${{ steps.ctx.outputs.state }}"
          echo "branch=${{ steps.ctx.outputs.head }} dry_run=${{ inputs.dry_run }}"
          echo "--- feedback gathered ---"
          head -40 /tmp/feedback.txt 2>/dev/null || echo "(none)"
