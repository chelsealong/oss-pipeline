name: Verify PR followups
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  langfuse:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '19067'
            sha: a6b4530830bdf851de99e0fc2e443f51f24a97b0
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: validation
      - uses: actions/checkout@v4
        with:
          repository: chelsealong/langfuse
          ref: ${{ matrix.sha }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify actual pricing and query paths
        working-directory: source
        env:
          FOLLOWUP_PR: ${{ matrix.pr }}
        run: |
          git apply "../validation/followup-validation/langfuse-$FOLLOWUP_PR.patch"
          bash "../validation/followup-validation/cloud-langfuse-$FOLLOWUP_PR.sh"
