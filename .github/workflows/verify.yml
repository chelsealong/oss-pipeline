name: Verify PR followups
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comfy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: validation
      - uses: actions/checkout@v4
        with:
          repository: chelsealong/ComfyUI
          ref: 7816fcb79c44794b56eb7db02b28ed97bba024d0
          persist-credentials: false
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          cd source
          python -m pip install -r requirements.txt pytest ruff pytest-subtests
      - name: Verify combined checkpoint quantization
        working-directory: source
        run: |
          git apply ../validation/followup-validation/comfy15520.patch
          cp comfy/sd.py /tmp/fixed-sd.py
          cp comfy/utils.py /tmp/fixed-utils.py
          git show HEAD:comfy/sd.py > comfy/sd.py
          git show HEAD:comfy/utils.py > comfy/utils.py
          if python -m pytest tests-unit/comfy_quant/test_unrecognized_quant_metadata.py -q; then
            echo 'Quantization regressions unexpectedly passed without fix'
            exit 1
          fi
          cp /tmp/fixed-sd.py comfy/sd.py
          cp /tmp/fixed-utils.py comfy/utils.py
          python -m pytest tests-unit/comfy_quant/test_unrecognized_quant_metadata.py -q
          ruff check comfy/sd.py comfy/utils.py tests-unit/comfy_quant/test_unrecognized_quant_metadata.py
          git diff --check
