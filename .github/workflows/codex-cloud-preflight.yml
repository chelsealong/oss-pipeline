name: Codex cloud preflight

# Read-only by default; the optional temporary PR probe requires explicit user
# authorization. Neither mode calls a model or changes the production switch.
on:
  workflow_dispatch:
    inputs:
      publication_probe:
        description: Explicitly requested temporary Hermes PR; close immediately after creation
        type: boolean
        default: false
      validation_canary:
        description: Rehearse synthetic Langfuse database, web and Chromium setup (no model or PR)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: codex-cloud-preflight
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install pinned Codex CLI and test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ripgrep bubblewrap apparmor-profiles apparmor-utils libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libcairo2 libpango-1.0-0 libasound2t64
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          corepack enable
          npm install --global @openai/codex@0.159.3
          bash install-validation-tools.sh
          python -m pip install PyYAML==6.0.3 cryptography==48.0.1 'aiohttp>=3.11.8,<4' 'pytest-aiohttp>=1,<2' 'pytest-asyncio>=1,<2' 'websocket-client>=1,<2'
      - name: Check portable runtime and offline regressions
        run: |
          codex --version
          node --version
          corepack --version
          command -v pnpm
          python -c 'import aiohttp, pytest_aiohttp, pytest_asyncio, websocket'
          gh --version
          command -v rg
          ./verify.sh
      - name: Confirm credential readiness without exposing values
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OSS_ARTIFACT_KEY: ${{ secrets.OSS_ARTIFACT_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          rows = ['## Codex cloud preflight', '',
                  'Runtime/credential validation; this workflow does not change the production switch.', '']
          for name in ['GH_TOKEN','QWEN_API_KEY','CODEX_AUTH_JSON','OPENAI_API_KEY']:
              rows.append(f'- {name}: '+('configured' if os.environ.get(name) else 'not configured'))
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(rows)+'\n')
          if not os.environ.get('GH_TOKEN'):
              raise SystemExit('Missing GH_PAT')
          import work_evidence
          assert work_evidence.decrypt(work_evidence.encrypt(b'preflight'))==b'preflight'
          # Keep credential identity comparisons encrypted, even for a public repo.
          # This makes cloud/local permission discrepancies diagnosable without
          # exporting a token or assuming the desktop login equals GH_PAT.
          import hashlib, json, urllib.request
          token=os.environ['GH_TOKEN']
          diagnostic={'fingerprint':hashlib.sha256(token.encode()).hexdigest(),'repositories':{}}
          for endpoint in ['user','repos/NousResearch/hermes-agent','repos/chelsealong/hermes-agent']:
              request=urllib.request.Request('https://api.github.com/'+endpoint,
                  headers={'Authorization':'Bearer '+token,'User-Agent':'oss-pipeline-preflight'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  value=json.load(response)
                  diagnostic['oauth_scopes']=response.headers.get('X-OAuth-Scopes')
              if endpoint=='user':diagnostic['actor']={'login':value['login'],'id':value['id']}
              else:diagnostic['repositories'][endpoint]={k:value.get(k) for k in ('full_name','archived','disabled','permissions')}
          work_evidence.atomic(Path('.runtime/preflight-github.json.enc'),work_evidence.encrypt(json.dumps(diagnostic).encode()))
          rows.append('- Encrypted recovery key: verified')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(rows)+'\n')
          PY
          gh api user --jq '"GitHub authentication verified for: " + .login'
      - name: Rehearse restoration of real cloud state without modifying production
        env:
          OSS_ARTIFACT_KEY: ${{ secrets.OSS_ARTIFACT_KEY }}
        run: |
          python - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path
          from unittest.mock import patch
          import cloud_store, runtime as rt
          with tempfile.TemporaryDirectory() as directory:
              root=Path(directory);store=root/'cloud-state';isolated=root/'isolated';isolated.mkdir()
              subprocess.run(['git','clone','--quiet','--depth=1','--single-branch','--branch','codex-state',
                  'https://github.com/chelsealong/oss-pipeline.git',str(store)],check=True,timeout=90)
              snapshot=json.loads((store/'checkpoint.json').read_text())
              with patch.object(rt,'ROOT',isolated),patch.object(rt,'DATA',isolated/'.runtime'),patch.object(rt,'CONFIG',isolated/'runtime.json'),patch.dict(os.environ,{'OSS_CLOUD_STATE_DIR':str(store)}):
                  cloud_store.restore()
                  with rt.db() as db:
                      assert db.execute('SELECT count(*) FROM tasks').fetchone()[0]==len(snapshot['tables']['tasks'])
                      assert db.execute('SELECT count(*) FROM calls').fetchone()[0]==len(snapshot['tables']['calls'])
                      assert db.execute("SELECT count(*) FROM tasks WHERE status='running'").fetchone()[0]==0
                  assert rt.getmeta('health') is None
                  encrypted=list((store/'evidence').glob('*.json.enc'))
                  for path in encrypted:
                      restored=json.loads((rt.DATA/'evidence'/path.name.removesuffix('.enc')).read_text())
                      assert restored['task']>0
                  print('Real cloud restore verified:',len(snapshot['tables']['tasks']),'tasks,',len(encrypted),'authenticated evidence bundles; no production writes.')
          PY
      - name: Rehearse synthetic browser and database validation
        if: inputs.validation_canary == true
        run: |
          python -u - <<'PY'
          import subprocess
          import validation_setup as validation
          import runtime as rt
          folder=rt.DATA/'validation-canary';folder.mkdir(parents=True,exist_ok=True)
          work=folder/'work'
          subprocess.run(['git','clone','--depth=1','https://github.com/langfuse/langfuse.git',str(work)],check=True,timeout=600)
          with validation.session({'id':'canary'}):
              validation.prepare_langfuse(work,folder)
              script="const {chromium}=require('playwright'); (async()=>{const b=await chromium.launch({headless:true});try{const p=await b.newPage();const r=await p.goto('http://localhost:3000',{waitUntil:'domcontentloaded',timeout:120000});if(!r||r.status()>=400)throw Error('Browser navigation failed');console.log('Synthetic Chromium verified:',r.status(),await p.title());}finally{await b.close();}})().catch(e=>{console.error(e);process.exit(1)});"
              cache=folder/'tool-cache'
              subprocess.run(validation.sandbox(work,cache,['pnpm','--filter=web','exec','node','-e',script]),env=validation.safe_env(cache),check=True,timeout=180)
          print('Synthetic validation canary passed; no model calls, upstream changes or production writes.')
          PY
      - name: Show synthetic setup diagnostics
        if: failure() && inputs.validation_canary == true
        run: tail -100 .runtime/validation-canary/validation-setup.log
      - name: Explicit temporary publication probe
        if: inputs.publication_probe == true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo='NousResearch/hermes-agent';head='chelsealong:fix/codex-hermes-132989'
          title='Temporary cloud permission check — '+os.environ['GITHUB_RUN_ID']
          def gh(*args):return subprocess.run(['gh',*args],capture_output=True,text=True,check=True,timeout=90).stdout.strip()
          existing=json.loads(gh('pr','list','--repo',repo,'--head',head,'--state','open','--json','number'))
          if existing:raise SystemExit('An existing PR owns this branch; refusing test publication')
          body=Path('.runtime/permission-probe-body.txt')
          body.write_text('Temporary cloud publication check explicitly requested by the contributor. This PR will be closed immediately; please do not review. It is excluded from contribution counts.\n')
          try:
              result=subprocess.run(['gh','pr','create','--repo',repo,'--base','main','--head',head,
                  '--title',title,'--body-file',str(body)],capture_output=True,text=True,timeout=90)
              if result.returncode:raise RuntimeError(result.stderr[-1000:])
              print('Created temporary PR:',result.stdout.strip())
          finally:
              # Reconcile even an ambiguous CLI timeout; close only this exact
              # explicitly requested probe, never a real contribution PR.
              rows=json.loads(gh('pr','list','--repo',repo,'--head',head,'--state','all','--json','number,title,author,state,url'))
              ours=[r for r in rows if r['title']==title and r['author']['login']=='chelsealong']
              for pr in ours:
                  if pr['state']=='OPEN':gh('pr','close',str(pr['number']),'--repo',repo)
                  state=json.loads(gh('pr','view',str(pr['number']),'--repo',repo,'--json','state'))['state']
                  if state!='CLOSED':raise RuntimeError('Temporary PR needs cleanup: '+pr['url'])
                  print('Verified temporary PR closed:',pr['url'])
              if len(ours)!=1:raise RuntimeError('Cloud publication was not verified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-preflight-${{ github.run_id }}
          path: .runtime/preflight-github.json.enc
          include-hidden-files: true
          retention-days: 14
