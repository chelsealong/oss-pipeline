name: Codex cloud preflight

# Read-only deployment rehearsal. Never calls a model or publishes upstream work.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-cloud-preflight
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install pinned Codex CLI and test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ripgrep
          corepack enable
          npm install --global @openai/codex@0.159.3
          python -m pip install PyYAML==6.0.3 cryptography==48.0.1 'aiohttp>=3.11.8,<4' 'pytest-aiohttp>=1,<2' 'pytest-asyncio>=1,<2' 'websocket-client>=1,<2'
      - name: Check portable runtime and offline regressions
        run: |
          codex --version
          node --version
          corepack --version
          command -v pnpm
          python -c 'import aiohttp, pytest_aiohttp, pytest_asyncio, websocket'
          gh --version
          command -v rg
          ./verify.sh
      - name: Confirm credential readiness without exposing values
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OSS_ARTIFACT_KEY: ${{ secrets.OSS_ARTIFACT_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          rows = ['## Codex cloud preflight', '',
                  'Read-only validation; this workflow does not change production.', '']
          for name in ['GH_TOKEN','QWEN_API_KEY','CODEX_AUTH_JSON','OPENAI_API_KEY']:
              rows.append(f'- {name}: '+('configured' if os.environ.get(name) else 'not configured'))
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(rows)+'\n')
          if not os.environ.get('GH_TOKEN'):
              raise SystemExit('Missing GH_PAT')
          import work_evidence
          assert work_evidence.decrypt(work_evidence.encrypt(b'preflight'))==b'preflight'
          # Keep credential identity comparisons encrypted, even for a public repo.
          # This makes cloud/local permission discrepancies diagnosable without
          # exporting a token or assuming the desktop login equals GH_PAT.
          import hashlib, json, urllib.request
          token=os.environ['GH_TOKEN']
          diagnostic={'fingerprint':hashlib.sha256(token.encode()).hexdigest(),'repositories':{}}
          for endpoint in ['user','repos/NousResearch/hermes-agent','repos/chelsealong/hermes-agent']:
              request=urllib.request.Request('https://api.github.com/'+endpoint,
                  headers={'Authorization':'Bearer '+token,'User-Agent':'oss-pipeline-preflight'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  value=json.load(response)
                  diagnostic['oauth_scopes']=response.headers.get('X-OAuth-Scopes')
              if endpoint=='user':diagnostic['actor']={'login':value['login'],'id':value['id']}
              else:diagnostic['repositories'][endpoint]={k:value.get(k) for k in ('full_name','archived','disabled','permissions')}
          work_evidence.atomic(Path('.runtime/preflight-github.json.enc'),work_evidence.encrypt(json.dumps(diagnostic).encode()))
          rows.append('- Encrypted recovery key: verified')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(rows)+'\n')
          PY
          gh api user --jq '"GitHub authentication verified for: " + .login'
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-preflight-${{ github.run_id }}
          path: .runtime/preflight-github.json.enc
          include-hidden-files: true
          retention-days: 14
