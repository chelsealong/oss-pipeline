name: Codex cloud preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-evidence-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==48.0.1
      - name: Summarize retained execution signals without exposing agent logs
        env:
          OSS_ARTIFACT_KEY: ${{ secrets.OSS_ARTIFACT_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,collections,json,os,re,urllib.request,zlib
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          key=base64.b64decode(os.environ['OSS_ARTIFACT_KEY'],validate=True)
          features={
            'broad_kill':r'\b(?:pkill|killall)\b|kill\s+(?:-9\s+)?-1\b|os\.killpg',
            'runner_target':r'Runner\.(?:Worker|Listener)|pkill[^\n]*runner',
            'build':r'\b(?:build|tsc|webpack|next)\b',
            'tests':r'\b(?:vitest|pytest|test|jest)\b',
            'install':r'\b(?:install|pnpm i|uv sync|npm ci)\b',
            'browser':r'playwright|chromium|puppeteer',
            'docker':r'\bdocker\b',
            'git_history':r'git (?:fetch|merge|rebase)',
            'bulk_evidence_read':r'evidence/|base64|generation\.events',
            'oom':r'out of memory|heap limit|OOM|ENOMEM|Cannot allocate memory',
            'disk_full':r'ENOSPC|No space left on device',
            'killed':r'SIGKILL|exit(?:ed)? (?:with )?code 137|Killed|signal 9',
            'timeout':r'timed out|ETIMEDOUT',
          }
          for task,attempt in [(780,2),(843,2),(842,2)]:
            url=f'https://api.github.com/repos/chelsealong/oss-pipeline/contents/evidence/{task}-{attempt}.json.enc?ref=63866643de99dc6aaec02d392e2bfd9bf112a58b'
            request=urllib.request.Request(url,headers={'Accept':'application/vnd.github.raw+json','Authorization':'Bearer '+os.environ['GH_TOKEN']})
            with urllib.request.urlopen(request,timeout=60) as response: raw=response.read()
            assert raw.startswith(b'OSSE1')
            payload=json.loads(zlib.decompress(AESGCM(key).decrypt(raw[5:17],raw[17:],b'oss-pipeline-evidence-v1')))
            rows=[];counts=collections.Counter();usage=None;log_flags=collections.Counter()
            for name,value in payload.get('files',{}).items():
              if not name.endswith(('.jsonl','.log')):continue
              content=base64.b64decode(value).decode(errors='replace')
              for label,pattern in features.items():
                if label in ('oom','disk_full','killed','timeout'):log_flags[label]+=len(re.findall(pattern,content,re.I))
              if not name.endswith('.jsonl'):continue
              for line in content.splitlines():
                try: event=json.loads(line)
                except ValueError:continue
                event=event.get('event',event);method=event.get('method','');data=event.get('params',{});counts[method]+=1
                if method=='thread/tokenUsage/updated':usage=data.get('tokenUsage',{}).get('total')
                item=data.get('item',{})
                if method not in ('item/started','item/completed'):continue
                command=json.dumps({k:v for k,v in item.items() if k not in ('aggregatedOutput','text','content')})
                row={'event':method,'type':item.get('type'),'status':item.get('status'),'exit':item.get('exitCode'),
                     'duration_ms':item.get('durationMs'),'at':event.get('emittedAtMs'),'keys':sorted(item),
                     'features':[label for label,pattern in features.items() if re.search(pattern,command,re.I)]}
                output=item.get('aggregatedOutput') or ''
                row['failure_signals']=[label for label in ('oom','disk_full','killed','timeout') if re.search(features[label],output,re.I)]
                rows.append(row)
            print(json.dumps({'task':task,'attempt':attempt,'phase':payload['execution'].get('phase'),
                'event_counts':counts,'usage':usage,'log_signals':log_flags,'recent_tools':[row for row in rows if row['type']=='commandExecution'][-24:],
                'process_control_events':[row for row in rows if 'broad_kill' in row['features'] or 'runner_target' in row['features']]}))
          PY
